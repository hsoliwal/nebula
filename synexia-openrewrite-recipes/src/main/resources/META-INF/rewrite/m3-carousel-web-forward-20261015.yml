        <!doctype html>
        <!-- SPDX-License-Identifier: Apache-2.0 -->
        <!-- SPDX-FileCopyrightText: 2026 Hitesh Soliwal and contributors -->
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Nebula Carousel browser profile</title>
          <style>
            body { font: 16px system-ui, sans-serif; margin: 2rem; color: #24303a; }
            .nebula-carousel { display: block; outline-offset: 3px; }
            #carousel-controls { margin-top: 1rem; }
