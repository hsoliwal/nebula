          </style>
          <script src="carousel/carousel.nocache.js"></script>
        </head>
        <body>
          <h1>Nebula Carousel</h1>
          <div id="carousel-example"></div>
          <div id="carousel-controls" aria-label="Carousel navigation"></div>
          <div id="carousel-status" aria-live="polite"></div>
