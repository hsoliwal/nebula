      fileContents: "<!-- SPDX-License-Identifier: Apache-2.0 OR EPL-2.0 -->\n# Build and replay\n\nThe executed evidence uses RAM-only Java 21 compilation, cached SWT 3.135.0/4974, existing JUnit and 32 pinned runtime jars. Its stock OpenRewrite cache is under coordinate 8.17.1 and reports implementation 8.17.0-SNAPSHOT; a pristine release is not attested. Exact READY, controller, wrapper, raw results and hashes are retained by the canonical evidence inventory linked from BINDINGS.json.\n\nApply the seven individually qualified leaf recipes in the order listed by BINDINGS.json. The existing module workflow uses this dry-run invocation for the production leaf:\n\n```text\nmvn -o org.openrewrite.maven:rewrite-maven-plugin:5.23.1:dryRun -Drewrite.configLocation=tools/m3/webcanvas-filter-retirement-20261116/recipes/receive-source-direct.yml -Drewrite.activeRecipes=com.synexia.m3.RepairWebCanvasCallerGraphFilterRetirement20261116\n```\n\nUse `run` instead of `dryRun` to apply reviewed before-images. Existing source/oracle files must match their exact bound text. Occupied new-test paths are preserved. The seven paths apply independently; a drifted or occupied path does not roll back changes to another path. Same/fresh replay, drift and foreign preservation are bound in the qualified leaf recipes.\n\nA full module build would use:\n\n```text\nmvn -o -f widgets/web/pom.xml -pl :org.eclipse.nebula.widgets.web.tests -am verify\n```\n\nNeither Maven command nor hosted Tycho discovery was executed in this task. Run filesystem builds only with the repository's approved output/temp routing and storage reserves; the C/c6 build/cache hold remains active. Offline artifacts must already exist. This package adds no downloads, profiles or caches.\n\nThe exact accepted RAM run is ready6ee1cffb132d3260daa9875addf6c7d25331cf3d, runtime369bcab259ff0f698a8c4c9a6ff806dfddaeca99 and raw4704fdffd6472b0ad5fa1042622a8c20d4295b62. Replay uses the existing qualified launcher and the exact canonical READY; its embedded controller and payload are immutable. Native/cache/memory/45-second/384-MiB/32-KiB guards remain active. Save and read back both runtime and decoded raw Git blobs before ACK.\n\nThe README and this file are generated by `materialize-review-docs.yml`. The seven source/test leaves remain independent; no optional composite is claimed qualified. These two document bytes are separately materialized before publication.\n"
      overwriteExisting: false
