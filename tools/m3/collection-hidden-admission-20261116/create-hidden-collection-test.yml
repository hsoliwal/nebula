        package org.eclipse.nebula.widgets.web.model;
        
        import static org.junit.Assert.*;
        import static org.eclipse.nebula.widgets.web.model.WebStates.*;
        import java.util.ArrayList;
        import java.util.Arrays;
        import java.util.Collection;
        import java.util.List;
        import org.junit.Before;
        import org.junit.Test;
        import org.junit.runner.RunWith;
        import org.junit.runners.Parameterized;
        
        /** CPU-only cell admission contracts over the actual eight Collection modes. */
        @RunWith(Parameterized.class)
        public class CollectionHiddenCellAdmissionTest {
            private static final int TARGET = 1, ITEMS = 40, WIDTH = 360, HEIGHT = 240;
            private final int mode;
            private final String modeName;
            private CollectionModel model;
            private String targetText;
        
            public CollectionHiddenCellAdmissionTest(int mode, String modeName) {
                this.mode = mode;
                this.modeName = modeName;
            }
        
            @Parameterized.Parameters(name = "{1}")
            public static Collection<Object[]> modes() {
                return Arrays.asList(new Object[][] {
                    {CollectionModel.KANBAN, "KANBAN"}, {CollectionModel.SWIPE, "SWIPE"},
                    {CollectionModel.PULL, "PULL"}, {CollectionModel.INFINITE, "INFINITE"},
                    {CollectionModel.REORDER, "REORDER"}, {CollectionModel.MESSAGES, "MESSAGES"},
                    {CollectionModel.PALETTE, "PALETTE"}, {CollectionModel.GALLERY, "GALLERY"}
                });
            }
        
            private CollectionModel actualModel() {
                return switch (mode) {
                case CollectionModel.KANBAN -> new KanbanBoardModel();
                case CollectionModel.SWIPE -> new SwipeActionsModel();
                case CollectionModel.PULL -> new PullToRefreshModel();
                case CollectionModel.INFINITE -> new InfiniteScrollModel();
                case CollectionModel.REORDER -> new ReorderDragModel();
                case CollectionModel.MESSAGES -> new MessageListModel();
                case CollectionModel.PALETTE -> new CommandPaletteModel();
                case CollectionModel.GALLERY -> new CollectionModel(
                        "gallery", WebStates.role("grid"), CollectionModel.GALLERY, ROUND, V_DEFAULT);
                default -> throw new AssertionError("unknown mode");
                };
            }
        
            @Before
            public void createActualModel() {
                model = actualModel();
                model.layout(WIDTH, HEIGHT);
                for (int i = 0; i < ITEMS; i++) {
                    String text = "CELL_" + modeName + "_" + i + (i == TARGET || (i & 1) == 0 ? "_keep" : "_drop");
                    int id = model.add(text);
                    assertEquals(i, id);
                    model.setValue(i, 13 * i);
                    model.setGroup(i, i & 1);
                    if (i == TARGET) targetText = text;
                }
                model.layout(WIDTH, HEIGHT);
                if (mode == CollectionModel.SWIPE) model.swipe(TARGET, -1000);
                if (mode == CollectionModel.PULL) {
                    model.pointer(P_WHEEL, 0, -4, 0);
                    assertTrue("active public PULL indicator", model.pull() > 0);
                }
                model.setState(TARGET, DRAGGING, true);
                model.setFocus(TARGET);
                model.setState(-1, FOCUS, true);
                assertTrue("target is resident in " + modeName, model.itemRect(TARGET, 2) > 0);
                assertTrue(model.itemRect(TARGET, 3) > 0);
            }
        
            private WebPaint paint() {
                WebPaint paint = new WebPaint();
                paint.rect(-9, -9, 1, 1, 0xabcdef);
                model.paint(paint);
                return paint;
            }
        
            /** Resolve string references so removal cannot disguise shifted text-table indices. */
            private static List<String> records(WebPaint paint) {
                List<String> result = new ArrayList<>();
                for (int r = 0; r < paint.count(); r++) {
                    StringBuilder row = new StringBuilder();
                    for (int f = 0; f < WebPaint.F_REF; f++) row.append(paint.get(r, f)).append(',');
                    if (paint.get(r, WebPaint.F_OP) == WebPaint.TEXT) {
                        String text = paint.text(paint.get(r, WebPaint.F_REF));
                        row.append(text.length()).append(':').append(text);
                    } else row.append(paint.get(r, WebPaint.F_REF));
                    result.add(row.toString());
                }
                return result;
            }
        
            private int texts(WebPaint paint, String value) {
                int count = 0;
                for (int r = 0; r < paint.count(); r++) {
                    if (paint.get(r, WebPaint.F_OP) == WebPaint.TEXT
                            && value.equals(paint.text(paint.get(r, WebPaint.F_REF)))) count++;
                }
                return count;
            }
        
            private int primarySurfaces(WebPaint paint, int[] rect) {
                int count = 0;
                int primary = mode == CollectionModel.MESSAGES || mode == CollectionModel.KANBAN
                        || mode == CollectionModel.GALLERY ? WebPaint.ROUND : WebPaint.RECT;
                for (int r = 0; r < paint.count(); r++) {
                    if (paint.get(r, WebPaint.F_OP) == primary
                            && paint.get(r, WebPaint.F_X) == rect[0]
                            && paint.get(r, WebPaint.F_Y) == rect[1]
                            && paint.get(r, WebPaint.F_W) == rect[2]
                            && paint.get(r, WebPaint.F_H) == rect[3]) count++;
                }
                return count;
            }
        
            private int dragOutlines(WebPaint paint, int[] rect) {
                int count = 0;
                for (int r = 0; r < paint.count(); r++) {
                    if (paint.get(r, WebPaint.F_OP) == WebPaint.ROUND_LINE
                            && paint.get(r, WebPaint.F_X) == rect[0] + 1
                            && paint.get(r, WebPaint.F_Y) == rect[1] + 1
                            && paint.get(r, WebPaint.F_W) == rect[2] - 2
                            && paint.get(r, WebPaint.F_H) == rect[3] - 2) count++;
                }
                return count;
            }
        
            private int[] targetRect() {
                return new int[] {model.itemRect(TARGET, 0), model.itemRect(TARGET, 1),
                        model.itemRect(TARGET, 2), model.itemRect(TARGET, 3)};
            }
        
            private int frameRecords() {
                return mode == CollectionModel.KANBAN ? 4 : mode == CollectionModel.PULL ? 2 : 0;
            }
        
            @Test
            public void visibleTranscriptAndHideShowKeepIdentityAndCallbacks() {
                int[] rect = targetRect(), snapshot = model.snapshot();
                WebPaint before = paint();
                List<String> transcript = records(before);
                assertEquals(1, texts(before, targetText));
                assertEquals(1, primarySurfaces(before, rect));
                assertEquals(1, dragOutlines(before, rect));
                int generation = model.generation(), focus = model.focus();
                long scroll = model.scrollOffset();
                List<String> events = new ArrayList<>();
                model.setDelta((item, mask) -> events.add(item + ":" + mask));
                model.setState(TARGET, HIDDEN, true);
                paint();
                model.setState(TARGET, HIDDEN, false);
                assertEquals(List.of("1:" + WebLanes.D_STATE, "1:" + WebLanes.D_STATE), events);
                assertEquals(generation + 2, model.generation());
                assertEquals(ITEMS, model.count());
                assertEquals(focus, model.focus());
                assertEquals(scroll, model.scrollOffset());
                assertArrayEquals(rect, targetRect());
                assertArrayEquals(snapshot, model.snapshot());
                assertEquals(transcript, records(paint()));
            }
        
            @Test
            public void hiddenResidentEmitsNoOwnTextSurfaceActionOrDrag() {
                int[] rect = targetRect();
                int count = model.count(), focus = model.focus();
                long scroll = model.scrollOffset();
                model.setState(TARGET, HIDDEN, true);
                assertEquals(count, model.count());
                assertEquals(focus, model.focus());
                assertEquals(scroll, model.scrollOffset());
                assertEquals(TARGET, model.itemAt(TARGET));
                assertArrayEquals(rect, targetRect());
                WebPaint hidden = paint();
                int text = texts(hidden, targetText), surface = primarySurfaces(hidden, rect);
                int drag = dragOutlines(hidden, rect);
                int action = mode == CollectionModel.SWIPE ? texts(hidden, "Delete") : 0;
                assertTrue("hidden target leaked mode=" + modeName + " text=" + text
                        + " primarySurface=" + surface + " dragOutline=" + drag + " action=" + action,
                        text == 0 && surface == 0 && drag == 0 && action == 0);
            }
        
            @Test
            public void allHiddenLeavesOnlyOriginalHeaderOrIndicator() {
                List<String> visible = records(paint());
                List<String> frame = List.copyOf(visible.subList(0, frameRecords()));
                for (int i = 0; i < ITEMS; i++) model.setState(i, HIDDEN | DISABLED | OPEN, true);
                assertEquals(ITEMS, model.count());
                assertEquals(TARGET, model.focus());
                assertEquals("only existing frame survives all hidden items in " + modeName, frame, records(paint()));
            }
        
            @Test
            public void widgetHiddenZeroGeometryAndEmptyKeepResetContract() {
                model.setState(-1, HIDDEN, true);
                assertEquals(0, paint().count());
                assertThrows(NullPointerException.class, () -> model.paint(null));
                model.setState(-1, HIDDEN, false);
                model.layout(0, HEIGHT);
                assertEquals(0, paint().count());
                model.layout(WIDTH, 0);
                assertEquals(0, paint().count());
                model.layout(WIDTH, HEIGHT);
                model.clear();
                WebPaint empty = paint();
                assertEquals(0, texts(empty, targetText));
                int expected = mode == CollectionModel.KANBAN || mode == CollectionModel.PULL ? 2 : 0;
                assertEquals("empty model keeps only its existing frame", expected, empty.count());
            }
        
            @Test
            public void unrelatedFlagsDoNotHideResidentCell() {
                model.setState(TARGET, DISABLED | SELECTED | CHECKED | OPEN | LOADING | HOVER | PRESSED, true);
                WebPaint painted = paint();
                assertEquals(1, texts(painted, targetText));
                assertEquals(1, primarySurfaces(painted, targetRect()));
                assertFalse(model.is(TARGET, HIDDEN));
            }
        
            @Test
            public void offscreenFilterRtlAndInvalidIndexLeaveVisibleRecords() {
                model.setFilter("keep");
                model.setRtl(true);
                model.setFocus(-1);
                assertEquals(0, model.itemRect(ITEMS - 1, 2));
                List<String> visible = records(paint());
                long scroll = model.scrollOffset();
                model.setState(ITEMS - 1, HIDDEN, true);
                assertEquals(visible, records(paint()));
                assertEquals(scroll, model.scrollOffset());
                assertEquals(ITEMS, model.count());
                int generation = model.generation();
                int[] snapshot = model.snapshot();
                assertThrows(IndexOutOfBoundsException.class, () -> model.setState(ITEMS, HIDDEN, true));
                assertEquals(generation, model.generation());
                assertArrayEquals(snapshot, model.snapshot());
                assertEquals(visible, records(paint()));
            }
        }
