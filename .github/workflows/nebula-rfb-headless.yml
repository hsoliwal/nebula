# SPDX-License-Identifier: EPL-2.0
# Fast, independent Java 21 protocol gate. Does not bypass Tycho/native tests.
name: Nebula RFB headless contracts

on:
  push:
    branches:
      - feature/terminal-rfb-nebula-20261118
    paths:
      - 'releng/vnc-protocol/**'
      - 'widgets/vnc/**'
      - '.github/workflows/nebula-rfb-headless.yml'
  pull_request:
    paths:
      - 'releng/vnc-protocol/**'
      - 'widgets/vnc/**'
      - '.github/workflows/nebula-rfb-headless.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfb-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure-java:
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    name: Java 21 RFB headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact RFB product source with strict warnings
        shell: bash
        run: |
          set -euo pipefail
          # Relative paths work unchanged in Bash on Linux, macOS and
          # Windows Git Bash; do not feed Java a mixed MSYS/Win32 temp path.
          dest=".nebula-rfb-headless-classes"
          mkdir -p "$dest"
          src="widgets/vnc/org.eclipse.nebula.widgets.vnc/src/org/eclipse/nebula/widgets/vnc"
          javac --release 21 -encoding UTF-8 -Xlint:all -Werror -d "$dest" \
            "$src/RfbClient.java" \
            "$src/RfbTileDecoder.java" \
            "$src/RfbHextileDecoder.java" \
            "$src/RfbTightDecoder.java" \
            "$src/RfbCursorDecoder.java" \
            "$src/RfbVeNCrypt.java" \
            "$src/RfbFramebuffer.java" \
            releng/vnc-protocol/src/org/eclipse/nebula/widgets/vnc/HeadlessRfbContracts.java
          java -Xmx128m -cp "$dest" \
            org.eclipse.nebula.widgets.vnc.HeadlessRfbContracts | tee .nebula-rfb-headless-result.txt
          grep -Fx 'NEBULA_RFB_HEADLESS=PASSED 8' .nebula-rfb-headless-result.txt
