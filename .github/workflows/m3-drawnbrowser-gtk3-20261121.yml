name: DrawnBrowser GTK3 clipping regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'widgets/drawnbrowser/**'
      - '.github/workflows/m3-drawnbrowser-gtk3-20261121.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawnbrowser-gtk3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-renderer:
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
        with:
          maven-version: 3.9.11
      - name: Checkout exact SWT receiver
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 25e637e40c5243f5210586007a74206d8dce7953
          path: .m3-swt
          fetch-depth: 0
          lfs: false
      - name: Build pinned SWT GTK3 distribution and bind the Tycho target
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev xvfb x11-xserver-utils openbox wmctrl
          GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
            bash releng/swt-receiver/retry-transient-maven-503.sh \
            mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
            -Dtycho.baseline.replace=none -pl :org.eclipse.swt.gtk.linux.x86_64 -am package
          python3 releng/swt-receiver/prepare_swt_receiver.py .m3-swt \
            releng/swt-receiver/swt-receiver-p2/target/binding \
            releng/swt-receiver/swt-receiver-p2/target/repository
          mvn -B -ntp -f releng/swt-receiver/swt-receiver-p2/pom.xml \
            -Dm3.swt.source="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
          cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
      - name: Run entire DrawnBrowser module and native SWT UI tests under X11
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum bash -c '
            set -euo pipefail
            openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/drawnbrowser-openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 100); do
              if wmctrl -m >/dev/null 2>&1; then break; fi
              kill -0 "$wm_pid" 2>/dev/null || exit 1
              sleep 0.1
            done
            wmctrl -m
            "$@"
          ' drawnbrowser-x11 mvn -V -B --fail-at-end -f widgets/drawnbrowser/pom.xml clean verify \
            -Dtycho.localArtifacts=ignore \
            -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false \
            -Dtests.vmargs=-Xcheck:jni \
            "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing pinned GC digest}" \
            "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing platform}"
      - name: Fail if DrawnBrowser tests are absent, skipped or failing
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          reports = sorted(glob.glob('widgets/drawnbrowser/**/target/surefire-reports/TEST-*.xml', recursive=True))
          if not reports:
              sys.exit('FAIL: no DrawnBrowser TEST-*.xml reports; no vacuous pass')
          tests = failed = skipped = 0
          for f in reports:
              doc = ET.parse(f).getroot()
              suites = [doc] if doc.tag.endswith('testsuite') else list(doc)
              for suite in suites:
                  if not suite.tag.endswith('testsuite'):
                      continue
                  tests += int(suite.get('tests', '0'))
                  failed += int(suite.get('failures', '0')) + int(suite.get('errors', '0'))
                  skipped += int(suite.get('skipped', '0'))
          print(f'DrawnBrowser reports={len(reports)} tests={tests} failed={failed} skipped={skipped}')
          if tests < 318 or failed or skipped:
              sys.exit('FAIL: required baseline 318 tests and zero failures/skips')
          PY
      - name: Upload source-bound DrawnBrowser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawnbrowser-gtk3-test-reports
          if-no-files-found: warn
          path: |
            widgets/drawnbrowser/**/target/surefire-reports/
            releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
            ${{ runner.temp }}/drawnbrowser-openbox.log
