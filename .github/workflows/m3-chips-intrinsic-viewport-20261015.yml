# SPDX-License-Identifier: Apache-2.0
name: Nebula Chips intrinsic close-button Canvas state
on:
  pull_request:
    paths:
      - 'widgets/chips/org.eclipse.nebula.widgets.chips/src/org/eclipse/nebula/widgets/chips/Chips.java'
      - 'widgets/chips/org.eclipse.nebula.widgets.chips/tests/**'
      - 'widgets/chips/org.eclipse.nebula.widgets.chips/proof/**'
      - '.github/workflows/m3-chips-intrinsic-viewport-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-contract-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run original-vs-candidate close-paint and MouseUp Java contract
        run: bash widgets/chips/org.eclipse.nebula.widgets.chips/proof/run-chips-java.sh
  native-c17-jni-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run strict C17, JVM interpreted and UBSan JNI Java-geometry parity
        run: bash widgets/chips/org.eclipse.nebula.widgets.chips/proof/run-chips-jni.sh
