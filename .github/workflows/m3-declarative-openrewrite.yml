name: Nebula M3 declarative OpenRewrite convergence

on:
  push:
    branches:
      - "m3/openrewrite-declarative-convergence-20261004"
    paths:
      - "m3/recipe-first/**"
      - "m3/docs/openrewrite-declarative-convergence.md"
      - "m3/README.md"
      - "pom.xml"
      - ".github/workflows/m3-declarative-openrewrite.yml"
  pull_request:
    paths:
      - "m3/recipe-first/**"
      - "m3/docs/openrewrite-declarative-convergence.md"
      - "m3/README.md"
      - "pom.xml"
      - ".github/workflows/m3-declarative-openrewrite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recipe-proof:
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"

      - name: 2 compile and install source-first M3 reactor dependencies
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -DskipTests install

      - name: 3 declarative resource and source-sealed recipe proof
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -pl recipe-first -am
          -Dtest=NebulaM3DeclarativeConvergenceTest,NebulaM3DeclarativeConvergenceControlRecipeTest,NebulaM3Java21ConvergenceRecipeTest,NebulaM3RecipeDagManifestTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 4 full recipe-first module verification
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -pl recipe-first -am verify
