name: M3 Nebula recipe-first convergence

on:
  pull_request:
    paths:
      - 'm3/**'
      - '.m3/**'
      - 'pom.xml'
      - '.github/workflows/m3-nebula-recipe-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.6

      - name: 1 - Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          git diff --check "$BASE_SHA...HEAD" --
          .
          ':(exclude)m3/recipe-first/src/main/resources/org/eclipse/nebula/m3/rewrite/exact/svg-loader-length/SvgLoader.after.java.txt'
          ':(exclude)m3/recipe-first/src/test/resources/org/eclipse/nebula/m3/rewrite/exact/svg-loader-length/SvgLoader.before.java.txt'

      - name: 2 - M3 custody and saved convergence contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "$BASE_SHA...HEAD" | grep -Ev '^(m3/|\.m3/|pom\.xml$|\.github/workflows/m3-nebula-recipe-first\.yml$|org\.eclipse\.nebula\.presentations\.shelf/src/org/eclipse/swt/nebula/presentations/shelf/CTabFolderStackPresentation\.java$|org\.eclipse\.nebula\.presentations\.shelf/src/org/eclipse/swt/nebula/presentations/shelf/EmptyStandaloneStackPresentation\.java$|org\.eclipse\.nebula\.presentations\.shelf/src/org/eclipse/swt/nebula/presentations/shelf/PShelfStackPresentation\.java$|org\.eclipse\.nebula\.presentations\.shelf/src/org/eclipse/swt/nebula/presentations/shelf/PresentationFactory\.java$|releng/org\.eclipse\.nebula\.nebula\-parent/pom\.xml$|releng/org\.eclipse\.nebula\.nebula\-parent/\.gitattributes$|\.github/workflows/\.gitattributes$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.css/src/org/eclipse/nebula/widgets/cdatetime/css/CDateTimePropertyHandler\.java$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.css/\.gitattributes$|\.gitattributes$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.tests/src/org/eclipse/nebula/widgets/cdatetime/css/BaseCSSThemingTest\.java$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.tests/src/org/eclipse/nebula/widgets/cdatetime/tests/css/CSSPropertyHandlerSimpleProviderImpl\.java$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4/src/org/eclipse/nebula/widgets/cdatetime/example/e4/parts/SimpleWidgetsPart\.java$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4/src/org/eclipse/nebula/widgets/cdatetime/example/e4/parts/BigWidgetsPart\.java$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4/META\-INF/MANIFEST\.MF$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4\.product$|widgets/cdatetime/org\.eclipse\.nebula\.widgets\.cdatetime\.example\.e4/\.gitattributes$)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Nebula production/source path changed outside the saved M3 convergence lane:\n%s\n' "$unexpected"
            exit 1
          fi
          python3 m3/verify-source-custody.py "$BASE_SHA"
          bash -n m3/convergence/verify.sh
          grep -F $'3\tSECOND_PASS_SIGNAL_CHAIN' m3/convergence/PLAN.tsv
          grep -F $'8\tFILE_FIXED_POINT' m3/convergence/PLAN.tsv
          grep -F 'source.mutation=false' .m3/atom-pattern/policy.properties
          grep -F 'source.promotion=false' .m3/atom-pattern/policy.properties
          grep -F 'java.typedRecipe=com.synexia.rewrite.M3RepositoryAtomizePatternizeRecipe' .m3/atom-pattern/policy.properties
          grep -F '<recipe>com.synexia.rewrite.M3RepositoryAtomPatternSecondPass</recipe>' pom.xml
          grep -F 'java.secondPassRecipe=com.synexia.rewrite.M3RepositoryAtomPatternSecondPass' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassPassBudget=4' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassUpstreamBranch=develop' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassUpstreamCommit=daaab09a1b91fe8344c1ea97359342b52739bf38' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassSignalChainClass=com.synexia.rewrite.M3AtomPatternSignalChainRecipe' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassCanonicalCatalog=com.synexia.m3.recipe.OpenRewriteRecipeDagPlan' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassStateMode=SHARED_JVM_COMPOSITE' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassExternalLeafFanOut=false' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassMutation=false' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassReplacement=false' .m3/atom-pattern/policy.properties
          grep -F 'java.secondPassPromotion=false' .m3/atom-pattern/policy.properties
          grep -F 'java.localCandidateRecipe=org.eclipse.nebula.m3.rewrite.NebulaM3Java21ConvergenceRecipe' .m3/atom-pattern/policy.properties
          grep -F 'java.localCandidateScope=FILE' .m3/atom-pattern/policy.properties
          grep -F 'java.localCandidatePromotion=false' .m3/atom-pattern/policy.properties

      - name: Execute tested exact compilation bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/recipe-first/pom-compile-bootstrap.xml -Papply -Dm3.bootstrap.root="$GITHUB_WORKSPACE" verify
          mvn -B -ntp -f m3/recipe-first/pom-compile-bootstrap.xml -Papply -Dm3.bootstrap.root="$GITHUB_WORKSPACE" verify
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('m3/recipe-first/target/compile-bootstrap/surefire-reports/TEST-org.eclipse.nebula.m3.rewrite.exact.NebulaM3CompileBootstrapRecipeTest.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.get('tests', '0')) >= 6
          assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          PYTEST

      - name: Capture exact checkout and actual recipe SDK for local replay
        if: always()
        run: python3 m3/convergence/capture_execution_inputs.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/nebula-replay-inputs"

      - name: Preserve source and SDK replay inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-replay-inputs
          if-no-files-found: error
          path: ${{ runner.temp }}/nebula-replay-inputs/

      - name: 3 - Compile and test the Nebula-local recipe crate
        run: mvn -B -ntp -f m3/reactor.xml verify

      - name: 3a - Install the proven Nebula-local recipe artifact for review
        run: mvn -B -ntp -f m3/reactor.xml install

      - name: 3b - Run read-only challenge donor and Java-before-JNI review
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          mvn -B -ntp -Pm3-local-repository-review -DskipMavenParsing=true org.openrewrite.maven:rewrite-maven-plugin:6.46.1:dryRunNoFork
          git diff --exit-code

      - name: 3c - Run exact merged Synexia repository second-pass recipe when authorized
        env:
          GH_TOKEN: ${{ secrets.M3_SYNEXIA_TOKEN }}
          SYNEXIA_COMMIT: daaab09a1b91fe8344c1ea97359342b52739bf38
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "SECOND_PASS_EXECUTION=SKIPPED_NO_M3_SYNEXIA_TOKEN"
            exit 0
          fi
          SECOND_PASS_RECIPE=com.synexia.rewrite.M3RepositoryAtomPatternSecondPass
          SYNEXIA_DIR="$RUNNER_TEMP/com.synexia-second-pass"
          rm -rf "$SYNEXIA_DIR"
          gh repo clone hsoliwal/com.synexia "$SYNEXIA_DIR"
          git -C "$SYNEXIA_DIR" checkout --detach "$SYNEXIA_COMMIT"
          test "$(git -C "$SYNEXIA_DIR" rev-parse HEAD)" = "$SYNEXIA_COMMIT"
          (
            cd "$SYNEXIA_DIR"
            ./mvnw -B -ntp -pl synexia-openrewrite-recipes -am -DskipTests install
          )
          git diff --exit-code
          mvn -B -ntp -Pm3-atomize-patternize \
            -Drewrite.activeRecipes="$SECOND_PASS_RECIPE" \
            -DskipMavenParsing=true \
            org.openrewrite.maven:rewrite-maven-plugin:6.46.1:dryRunNoFork
          git diff --exit-code
          mvn -B -ntp -Pm3-atomize-patternize \
            -Drewrite.activeRecipes="$SECOND_PASS_RECIPE" \
            -DskipMavenParsing=true \
            org.openrewrite.maven:rewrite-maven-plugin:6.46.1:dryRunNoFork
          git diff --exit-code
          echo "SECOND_PASS_EXECUTION=READ_ONLY_TWO_RUNS_COMPLETE"

      - name: 4 - Export content-addressed recipe DAG
        run: mvn -B -ntp -f m3/reactor.xml -Pdag-manifest verify

      - name: 4a - Verify exact raw SvgLoader preimage
        shell: bash
        run: |
          set -euo pipefail
          SVG_PATH='widgets/cwt/org.eclipse.nebula.cwt/src/org/eclipse/nebula/cwt/svg/SvgLoader.java'
          mvn -B -ntp -f m3/reactor.xml -Psource-seal -DskipTests \
            -Dm3.seal.root="$GITHUB_WORKSPACE" \
            -Dm3.seal.path="$SVG_PATH" \
            -Dm3.seal.sha256='23d730f01826b3d5c3de5d9f5299f2db11574ae3c482956b20928aaa676f9a08' \
            verify

      - name: 6b - Prove explicit FILE materializer without source writes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='widgets/cwt/org.eclipse.nebula.cwt/src/org/eclipse/nebula/cwt/svg/SvgLoader.java'
          OUT='m3/recipe-first/target/a3-file-proof'
          EXPECTED='m3/recipe-first/src/main/resources/org/eclipse/nebula/m3/rewrite/exact/svg-loader-length/SvgLoader.after.java.txt'
          sha256sum "$SOURCE" > "$RUNNER_TEMP/nebula-a3-source.before.sha"
          mvn -B -ntp -f m3/recipe-first/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.mainClass=org.eclipse.nebula.m3.NebulaM3A3Apply \
            -Dexec.args="$GITHUB_WORKSPACE $OUT $SOURCE"
          sha256sum "$SOURCE" > "$RUNNER_TEMP/nebula-a3-source.after.sha"
          diff -u "$RUNNER_TEMP/nebula-a3-source.before.sha" "$RUNNER_TEMP/nebula-a3-source.after.sha"
          grep -F "$SOURCE" "$OUT/receipt.tsv"
          grep -F "true" "$OUT/receipt.tsv"
          cmp "$OUT/candidate/$SOURCE" "$EXPECTED"
          git diff --exit-code -- "$SOURCE"

      - name: 7 - Baseline original Nebula Tycho reactor
        run: xvfb-run -a mvn -V -B -ntp clean verify -Dtycho.localArtifacts=ignore

      - name: 5 - Inventory the whole Nebula Java checkout
        run: mvn -B -ntp -f m3/reactor.xml -Pinventory -Dm3.nebula.root="$GITHUB_WORKSPACE" -Dm3.nebula.out="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-inventory" verify

      - name: 6 - Require complete Java parse inventory
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'failureRows\t0' m3/recipe-first/target/nebula-m3-inventory/nebula-m3-summary.tsv

      - name: 8 - Install the proven Nebula-local recipe artifact
        run: mvn -B -ntp -f m3/reactor.xml install

      - name: 9 - Apply FILE-local atomize patternize document DAG
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-candidate"
          mkdir -p "$CANDIDATE_DIR/postimage"
          mvn -B -ntp -Pm3-local-file-convergence -DskipMavenParsing=true org.openrewrite.maven:rewrite-maven-plugin:6.46.1:runNoFork
          mvn -B -ntp -f m3/reactor.xml -Psource-seal -DskipTests \
            -Dm3.seal.root="$GITHUB_WORKSPACE" \
            -Dm3.seal.path='widgets/cwt/org.eclipse.nebula.cwt/src/org/eclipse/nebula/cwt/svg/SvgLoader.java' \
            -Dm3.seal.sha256='d56e584eb16981496046c7dbb67be8a18ff68aa01953084a441329bacc2c78eb' \
            verify
          git diff --check
          git diff --name-only | sort > "$CANDIDATE_DIR/changed-files.txt"
          unexpected="$(grep -Ev '\.java$' "$CANDIDATE_DIR/changed-files.txt" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'FILE recipe escaped Java source scope:\n%s\n' "$unexpected"
            exit 1
          fi
          grep -Fx 'widgets/cwt/org.eclipse.nebula.cwt/src/org/eclipse/nebula/cwt/svg/SvgLoader.java' "$CANDIDATE_DIR/changed-files.txt"
          git diff --binary > "$CANDIDATE_DIR/candidate.patch"
          cp "$CANDIDATE_DIR/candidate.patch" "$CANDIDATE_DIR/first.patch"
          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            mkdir -p "$CANDIDATE_DIR/postimage/$(dirname "$changed")"
            cp "$changed" "$CANDIDATE_DIR/postimage/$changed"
          done < "$CANDIDATE_DIR/changed-files.txt"

      - name: 10 - Prove complete recipe DAG fixed point
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-candidate"
          mvn -B -ntp -Pm3-local-file-convergence -DskipMavenParsing=true org.openrewrite.maven:rewrite-maven-plugin:6.46.1:runNoFork
          mvn -B -ntp -f m3/reactor.xml -Psource-seal -DskipTests \
            -Dm3.seal.root="$GITHUB_WORKSPACE" \
            -Dm3.seal.path='widgets/cwt/org.eclipse.nebula.cwt/src/org/eclipse/nebula/cwt/svg/SvgLoader.java' \
            -Dm3.seal.sha256='d56e584eb16981496046c7dbb67be8a18ff68aa01953084a441329bacc2c78eb' \
            verify
          echo 'SOURCE_SEAL_FIXED_POINT=true'
          git diff --binary > "$CANDIDATE_DIR/second.patch"
          diff -u "$CANDIDATE_DIR/first.patch" "$CANDIDATE_DIR/second.patch"

      - name: 11 - Verify SvgLoader length behavior on real SWT
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_SOURCE='m3/recipe-first/src/test/resources/org/eclipse/nebula/m3/rewrite/exact/svg-loader-length/SvgLoaderLengthTests.java.txt'
          VERIFY_TARGET='widgets/cwt/org.eclipse.nebula.cwt.tests/src/org/eclipse/nebula/cwt/svg/SvgLoaderLengthTests.java'
          cp "$VERIFY_SOURCE" "$VERIFY_TARGET"
          xvfb-run -a mvn -B -ntp -f widgets/cwt/pom.xml -pl org.eclipse.nebula.cwt.tests -am -DskipTests=false -Dtest=SvgLoaderLengthTests verify
          rm -f "$VERIFY_TARGET"

      - name: 12 - Original Nebula Tycho reactor on transformed candidates
        run: xvfb-run -a mvn -V -B -ntp clean verify -Dtycho.localArtifacts=ignore

      - name: 13 - Preserve candidate-only authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only --cached)"
          test ! -e widgets/cwt/org.eclipse.nebula.cwt.tests/src/org/eclipse/nebula/cwt/svg/SvgLoaderLengthTests.java
          grep -F $'8\tFILE_FIXED_POINT' m3/convergence/PLAN.tsv
          grep -F 'java.secondPassPromotion=false' .m3/atom-pattern/policy.properties
          grep -F 'java.localCandidatePromotion=false' .m3/atom-pattern/policy.properties

      - name: Capture original build dependency and classpath evidence
        if: always()
        run: python3 m3/convergence/capture_execution_inputs.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/nebula-full-build-inputs"

      - name: Preserve complete execution dependency inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-full-build-inputs
          if-no-files-found: error
          path: ${{ runner.temp }}/nebula-full-build-inputs/

      - name: Upload Nebula M3 inventory and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-m3-convergence
          if-no-files-found: warn
          path: |
            m3/recipe-first/target/nebula-m3-inventory/
            m3/recipe-first/target/nebula-m3-dag/
            m3/recipe-first/target/nebula-m3-candidate/
            m3/recipe-first/target/a3-file-proof/
            **/target/rewrite/
            **/target/surefire-reports/
            m3/convergence/PLAN.tsv
            .m3/atom-pattern/policy.properties
