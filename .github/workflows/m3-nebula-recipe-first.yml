name: M3 Nebula recipe-first convergence

on:
  pull_request:
    paths:
      - 'm3/**'
      - '.m3/**'
      - 'pom.xml'
      - '.github/workflows/m3-nebula-recipe-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.6

      - name: 1 - Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: 2 - M3 custody and saved convergence contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "$BASE_SHA...HEAD"             | grep -Ev '^(m3/|\.m3/|pom\.xml$|\.github/workflows/m3-nebula-recipe-first\.yml$)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Nebula production/source path changed outside the saved M3 convergence lane:\n%s\n' "$unexpected"
            exit 1
          fi
          bash -n m3/convergence/verify.sh
          grep -F $'4\tFILE_FIXED_POINT' m3/convergence/PLAN.tsv
          grep -F 'source.mutation=false' .m3/atom-pattern/policy.properties
          grep -F 'source.promotion=false' .m3/atom-pattern/policy.properties
          grep -F 'java.typedRecipe=com.synexia.rewrite.M3RepositoryAtomizePatternizeRecipe'             .m3/atom-pattern/policy.properties

      - name: 3 - Compile and test the Nebula-local recipe crate
        run: mvn -B -ntp -f m3/recipe-first/pom.xml verify

      - name: 4 - Inventory the whole Nebula Java checkout
        run: >
          mvn -B -ntp -f m3/recipe-first/pom.xml -Pinventory
          -Dm3.nebula.root="$GITHUB_WORKSPACE"
          -Dm3.nebula.out="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-inventory"
          verify

      - name: 5 - Require complete Java parse inventory
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'failureRows\t0'             m3/recipe-first/target/nebula-m3-inventory/nebula-m3-summary.tsv

      - name: 6 - Original Nebula Tycho reactor
        run: mvn -V -B clean verify -Dtycho.localArtifacts=ignore

      - name: 7 - Require candidate-only repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload Nebula M3 inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-m3-inventory
          if-no-files-found: warn
          path: |
            m3/recipe-first/target/nebula-m3-inventory/
            m3/convergence/PLAN.tsv
            .m3/atom-pattern/policy.properties
