name: M3 Nebula recipe-first inventory

on:
  pull_request:
    paths:
      - 'm3/**'
      - '.github/workflows/m3-nebula-recipe-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.6
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Compile and test M3 recipe crate
        run: mvn -B -ntp -f m3/recipe-first/pom.xml verify
      - name: Inventory the whole Nebula Java checkout
        run: >
          mvn -B -ntp -f m3/recipe-first/pom.xml -Pinventory
          -Dm3.nebula.root="$GITHUB_WORKSPACE"
          -Dm3.nebula.out="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-inventory"
          verify
      - name: Require complete Java parse inventory
        run: |
          set -euo pipefail
          grep -F $'failureRows\t0' m3/recipe-first/target/nebula-m3-inventory/nebula-m3-summary.tsv
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: nebula-m3-inventory
          path: m3/recipe-first/target/nebula-m3-inventory/
