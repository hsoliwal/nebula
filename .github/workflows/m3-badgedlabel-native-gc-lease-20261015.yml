# SPDX-License-Identifier: Apache-2.0
name: Nebula original BadgedLabel GC measure lease
on:
  pull_request:
    paths:
      - 'widgets/badgedlabel/org.eclipse.nebula.widgets.badgedlabel/**'
      - '.github/workflows/m3-badgedlabel-native-gc-lease-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-native-resource-lifetime-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original vs candidate native GC lease callback model, normal and interpreted
        run: bash widgets/badgedlabel/org.eclipse.nebula.widgets.badgedlabel/run-gc-proof.sh
