name: Nebula M3 A3 mastery Java 21

on:
  push:
    branches:
      - 'm3/a3-mastery-campaign-20261005'
    paths:
      - 'm3/recipe-first/**'
      - 'm3/docs/A3_MASTERY.md'
      - '.github/workflows/m3-a3-mastery-java21.yml'
  pull_request:
    paths:
      - 'm3/recipe-first/**'
      - 'm3/docs/A3_MASTERY.md'
      - '.github/workflows/m3-a3-mastery-java21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"

      - name: Build and test the repository-owned parser
        run: mvn -B -ntp -f m3/openrewrite-line-terminators/pom.xml install

      - name: Compile recipe-first module
        run: >
          mvn -B -ntp
          -f m3/recipe-first/pom.xml
          -DskipTests compile

      - name: Prove mastery installer fixed point
        run: >
          mvn -B -ntp
          -f m3/recipe-first/pom.xml
          -Dtest=NebulaM3A3MasteryRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Execute 288-row compiler/runtime mastery campaign
        run: >
          mvn -B -ntp
          -f m3/recipe-first/pom.xml
          -Dtest=NebulaM3A3LabTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify named OpenRewrite recipe is discoverable
        run: >
          mvn -B -ntp
          -f m3/recipe-first/pom.xml
          -Pa3-mastery
          rewrite:dryRun
