# SPDX-License-Identifier: EPL-2.0
name: Nebula Terminal and RFB/VNC contracts

on:
  push:
    branches:
      - feature/terminal-rfb-nebula-20261118
    paths:
      - 'widgets/terminal/**'
      - 'widgets/vnc/**'
      - 'releng/swt-receiver/**'
      - '.github/workflows/terminal-vnc-contracts.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'widgets/terminal/**'
      - 'widgets/vnc/**'
      - 'releng/org.eclipse.nebula.nebula-parent/pom.xml'
      - 'releng/swt-receiver/**'
      - '.github/workflows/terminal-vnc-contracts.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: terminal-vnc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swt-receiver:
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Prove receipt validator rejects tampering
        shell: bash
        run: |
          python3 -m unittest discover -v -s releng/swt-receiver/tests -p test_verify_reusable_receiver.py
      - name: Restore pinned verified SWT receiver from immutable cache
        uses: actions/cache/restore@v4
        id: swt-cache
        with:
          key: nebula-swt3.136-gtk3-25e637e40-20261122-v1
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/
            releng/swt-receiver/swt-receiver-p2/target/repository/
      - name: Rehydrate known successful pinned SWT receiver artifact
        id: swt-proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=releng/swt-receiver/swt-receiver-p2/target
          if [[ '${{ steps.swt-cache.outputs.cache-hit }}' == 'true' ]]; then
            echo 'SWT receiver restored from pinned Actions cache'
            python3 releng/swt-receiver/verify_reusable_receiver.py "$target"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          elif gh run download 44986161156 --repo hsoliwal/nebula \
              --name nebula-terminal-vnc-pinned-swt --dir "$target"; then
            echo 'Restored exact SWT receiver from successful run 44986161156'
            python3 releng/swt-receiver/verify_reusable_receiver.py "$target"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No qualified cached artifact; building exact pinned SWT receiver' >&2
            rm -rf "$target"
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact SWT receiver source
        if: steps.swt-proof.outputs.reused != 'true'
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 25e637e40c5243f5210586007a74206d8dce7953
          path: .m3-swt
          fetch-depth: 0
          lfs: false
      - name: Build and bind the pinned GTK3 SWT 3.136 receiver
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev freeglut3-dev
          bash releng/swt-receiver/test-retry-transient-maven-503.sh
          export M3_HTTP503_ATTEMPTS=5 M3_HTTP503_RETRY_DELAY_SECONDS=15
          GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
            bash releng/swt-receiver/retry-transient-maven-503.sh \
              mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
                -Dtycho.baseline.replace=none \
                -pl :org.eclipse.swt.gtk.linux.x86_64 -am package
          python3 releng/swt-receiver/prepare_swt_receiver.py \
            .m3-swt \
            releng/swt-receiver/swt-receiver-p2/target/binding \
            releng/swt-receiver/swt-receiver-p2/target/repository
          mvn -B -f releng/swt-receiver/swt-receiver-p2/pom.xml \
            "-Dm3.swt.source=$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
      - name: Verify SWT receiver from cache or source build
        shell: bash
        run: |
          set -euo pipefail
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
      - name: Retain qualified receiver for subsequent feature commits
        if: steps.swt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: nebula-swt3.136-gtk3-25e637e40-20261122-v1
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/
            releng/swt-receiver/swt-receiver-p2/target/repository/
      - name: Distribute pinned SWT and composite p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          retention-days: 30
          if-no-files-found: error
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/composite/
            releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
            releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
            releng/swt-receiver/swt-receiver-p2/target/repository/

  vnc-protocol:
    needs: swt-receiver
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Bind pinned SWT p2 composite in identical checkout layout
        uses: actions/download-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          path: releng/swt-receiver/swt-receiver-p2/target
      - name: Validate SWT receiver and expose composite platform
        shell: bash
        run: |
          set -euo pipefail
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
          cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
      - name: Install SWT GTK3 native screen test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 dbus-x11 openbox wmctrl x11vnc
      - name: Verify RFB protocol and native screen pixels through Tycho
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24' \
            bash -ec '
              openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-vnc-openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 100); do
                if wmctrl -m >/dev/null 2>&1; then
                  break
                fi
                sleep 0.1
              done
              wmctrl -m >/dev/null || { echo "native window manager unavailable" >&2; exit 1; }
              # Use the real loopback-only x11vnc server on the current Xvfb.
              x11vnc -display "$DISPLAY" -localhost -nopw -forever -shared -rfbport 5913 -noxdamage >"${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" 2>&1 &
              vnc_pid=$!
              trap "kill $vnc_pid $wm_pid 2>/dev/null || true" EXIT
              ready=0
              for attempt in $(seq 1 100); do
                if (echo >/dev/tcp/127.0.0.1/5913) 2>/dev/null; then
                  ready=1
                  break
                fi
                if ! kill -0 "$vnc_pid" 2>/dev/null; then
                  cat "${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" >&2
                  exit 1
                fi
                sleep 0.1
              done
              if [ "$ready" != 1 ]; then
                cat "${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" >&2
                echo "Real VNC server did not bind loopback" >&2
                exit 1
              fi
              export NEBULA_RFB_REAL_SERVER_PORT=5913
              mvn -B -ntp -f widgets/vnc/pom.xml \
                -pl :org.eclipse.nebula.widgets.vnc.tests -am \
                -Dtycho.localArtifacts=ignore \
                "-Dtarget-platform-platform=$M3_SWT_PLATFORM" \
                -DfailIfNoTests=true clean verify
            '
      - name: Require all protocol test classes with no failures or skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target')
          reports = sorted(root.rglob('TEST-*.xml'))
          assert reports, 'no JUnit XML reports: tests were not executed'
          found, executed = set(), 0
          for file in reports:
              elem = ET.parse(file).getroot()
              if elem.tag == 'testsuites':
                  suites = list(elem.findall('testsuite'))
              else:
                  suites = [elem]
              for suite in suites:
                  name = suite.attrib.get('name', '')
                  found.add(name.rsplit('.', 1)[-1])
                  counts = {k: int(suite.attrib.get(k, '0'))
                            for k in ('tests','failures','errors','skipped')}
                  assert counts['failures'] == 0 and counts['errors'] == 0, file
                  assert counts['skipped'] == 0, f'skipped tests in {file}'
                  executed += counts['tests']
          required = {'RfbClientTest', 'RfbClientAdvancedTest',
                      'RfbTileDecoderTest', 'RfbVeNCryptTest',
                      'RfbFrameDamageTest',
                      'RfbCodecPropertyTest', 'RfbQueueBudgetTest',
                      'VncCanvasNativeTest', 'RfbRealServerTest',
                      'RfbTightDecoderTest', 'RfbCursorDecoderTest',
                      'RfbHextileDecoderTest', 'VncCursorNativeTest'}
          assert required <= found, f'missing tests: {required - found}'
          assert executed >= 45, f'expected at least 45 tests, got {executed}'
          print('NEBULA_RFB_TYCHO_PROTOCOL_TESTS=PASSED', executed)
          PY
      - name: Upload protocol test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-rfb-protocol-test-reports
          if-no-files-found: warn
          path: |
            widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target/surefire-reports/
            widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target/**/*.log

  terminal-compile:
    needs: swt-receiver
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Bind pinned SWT p2 composite in identical checkout layout
        uses: actions/download-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          path: releng/swt-receiver/swt-receiver-p2/target
      - name: Validate SWT receiver and expose composite platform
        shell: bash
        run: |
          set -euo pipefail
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
          cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
      - name: Install SWT GTK3 Terminal native acceptance dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 dbus-x11 openbox wmctrl
      - name: Compile and test embedded Eclipse Terminal on native SWT
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24' \
            bash -ec '
              openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-terminal-openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 100); do
                if wmctrl -m >/dev/null 2>&1; then
                  break
                fi
                sleep 0.1
              done
              wmctrl -m >/dev/null || { echo "native window manager unavailable" >&2; exit 1; }
              mvn -B -ntp -f widgets/terminal/pom.xml \
                -pl :org.eclipse.nebula.widgets.terminal.tests -am \
                -Dtycho.localArtifacts=ignore \
                "-Dtarget-platform-platform=$M3_SWT_PLATFORM" \
                -DfailIfNoTests=true clean verify
            '
      - name: Require parent-cascade and direct Terminal resource tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target')
          reports = sorted(root.rglob('TEST-*.xml'))
          assert reports, 'no Terminal JUnit XML reports'
          executed, seen = 0, set()
          for file in reports:
              tree = ET.parse(file).getroot()
              suites = list(tree.findall('testsuite')) if tree.tag == 'testsuites' else [tree]
              for suite in suites:
                  seen.add(suite.attrib.get('name','').rsplit('.',1)[-1])
                  tests = int(suite.attrib.get('tests',0))
                  failures = int(suite.attrib.get('failures',0))
                  errors = int(suite.attrib.get('errors',0))
                  skips = int(suite.attrib.get('skipped',0))
                  assert tests > 0 and not (failures or errors or skips), file
                  executed += tests
          assert 'TerminalWidgetNativeTest' in seen
          assert executed >= 2, f'expected two Terminal lifecycle cases, got {executed}'
          print('NEBULA_TERMINAL_NATIVE=PASSED', executed)
          PY
      - name: Upload Terminal native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-terminal-native-test-reports
          if-no-files-found: warn
          path: |
            widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target/surefire-reports/
            widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target/**/*.log
