# SPDX-License-Identifier: EPL-2.0
name: Nebula Terminal and RFB/VNC contracts

on:
  push:
    branches:
      - feature/terminal-rfb-nebula-20261118
    paths:
      - 'widgets/terminal/**'
      - 'widgets/vnc/**'
      - 'releng/swt-receiver/**'
      - '.github/workflows/terminal-vnc-contracts.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'widgets/terminal/**'
      - 'widgets/vnc/**'
      - 'releng/org.eclipse.nebula.nebula-parent/pom.xml'
      - 'releng/swt-receiver/**'
      - '.github/workflows/terminal-vnc-contracts.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: terminal-vnc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swt-receiver:
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Prove receipt validator rejects tampering
        shell: bash
        run: |
          python3 -m unittest discover -v -s releng/swt-receiver/tests -p 'test_verify*.py'
      - name: Restore pinned verified SWT receiver from immutable cache
        uses: actions/cache/restore@v4
        id: swt-cache
        with:
          key: nebula-swt3.138-gtk3-57efce1e-20261124-v2
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/
            releng/swt-receiver/swt-receiver-p2/target/repository/
      - name: Reuse only a verified current SWT receiver cache
        id: swt-proof
        shell: bash
        run: |
          set -euo pipefail
          target=releng/swt-receiver/swt-receiver-p2/target
          if [[ '${{ steps.swt-cache.outputs.cache-hit }}' == 'true' ]]; then
            echo 'SWT receiver restored from pinned Actions cache'
            python3 releng/swt-receiver/verify_reusable_receiver.py "$target"
            python3 releng/swt-receiver/verify_gtk_host_tests.py verify "$target"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No current verified cache; build the exact pinned SWT receiver' >&2
            rm -rf "$target"
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact SWT receiver source
        if: steps.swt-proof.outputs.reused != 'true'
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 57efce1ed6396d3d5ee34c23864260d88e819692
          path: .m3-swt
          fetch-depth: 0
          lfs: false
      # Parent source is a separate original Eclipse EDL-1.0 project, not Synexia code.
      # The SWT POM requests ../eclipse-platform-parent; keep the exact source identity.
      - name: Checkout exact Eclipse 4.42 parent source
        if: steps.swt-proof.outputs.reused != 'true'
        uses: actions/checkout@v4
        with:
          repository: eclipse-platform/eclipse.platform.releng.aggregator
          ref: 8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec
          path: .m3-eclipse-releng
          sparse-checkout: eclipse-platform-parent
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          lfs: false
      - name: Bind pinned upstream Eclipse parent without changing SWT source
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          src=.m3-eclipse-releng/eclipse-platform-parent/pom.xml
          test "$(git -C .m3-eclipse-releng rev-parse HEAD)" = "8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec"
          test "$(git hash-object "$src")" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
          printf '%s  %s\n' "121b6c26d986874391d26d114377e3beda91723b0d675146bdd194dbfe01e264" "$src" | sha256sum --check
          test "$(git -C .m3-swt rev-parse HEAD)" = "57efce1ed6396d3d5ee34c23864260d88e819692"
          test "$(git hash-object .m3-swt/pom.xml)" = "341c07d199041c55d89a99fcc93560074e425716"
          test ! -e eclipse-platform-parent
          mkdir -p eclipse-platform-parent
          cp "$src" eclipse-platform-parent/pom.xml
          test "$(git hash-object eclipse-platform-parent/pom.xml)" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          ns = "{http://maven.apache.org/POM/4.0.0}"
          parent = ET.parse("eclipse-platform-parent/pom.xml").getroot()
          swt = ET.parse(".m3-swt/pom.xml").getroot()
          def value(element, path):
              node = element.find(path)
              return node.text.strip() if node is not None and node.text else None
          assert (value(parent, ns+"groupId"), value(parent, ns+"artifactId"),
                  value(parent, ns+"version"), value(parent, ns+"packaging")) == (
                      "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT", "pom")
          expected = swt.find(ns+"parent")
          assert expected is not None
          assert (value(expected, ns+"groupId"), value(expected, ns+"artifactId"),
                  value(expected, ns+"version"), value(expected, ns+"relativePath")) == (
                      "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT",
                      "../eclipse-platform-parent")
          assert "Eclipse Distribution License v1.0" in Path("eclipse-platform-parent/pom.xml").read_text()
          print("SWT_LOCAL_PARENT_SOURCE_IDENTITY=PASS")
          PY
      - name: Verify Eclipse parent source before building pinned SWT
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s releng/swt-receiver -p 'test_prepare_eclipse_platform_parent.py'
          python3 releng/swt-receiver/prepare_eclipse_platform_parent.py .m3-eclipse-releng .m3-swt
      - name: Assemble all pinned SWT 3.138 fragments without foreign-platform execution
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev freeglut3-dev libwebkit2gtk-4.1-0 xvfb dbus-x11 openbox wmctrl
          bash releng/swt-receiver/test-retry-transient-maven-503.sh
          export M3_HTTP503_ATTEMPTS=5 M3_HTTP503_RETRY_DELAY_SECONDS=15
          # prepare_swt_receiver.py binds all nine SWT jars (core + eight platform
          # fragments). Name every fragment, as maven.yaml does for the same pin;
          # only GTK x86_64 compiles native .so files on this host.
          # Preserve the current receiver's complete eight-fragment input set.
          # The mvn arguments are token-for-token those of maven.yaml's "Build and
          # bind the pinned SWT GTK3 distribution" step (and codeql.yml), plus
          # -Dmaven.test.skip=false (Maven's default, stated explicitly as in the
          # original GTK host-test step below):
          # - -DskipTests=true: SWT binaries/pom.xml binds the maven-surefire-plugin
          #   'execute-tests' execution (goal test) to every fragment, so without it
          #   the Win32 fragments' unit tests would run on this Linux host.
          # - The three *-repo.url overrides point eclipse-platform-parent's
          #   <pluginRepositories> at Maven Central, so plugins and the [3.39,) ECJ
          #   compiler range resolve as in maven.yaml, not from Eclipse snapshots.
          swt_fragments=':org.eclipse.swt.cocoa.macosx.aarch64,:org.eclipse.swt.cocoa.macosx.x86_64,:org.eclipse.swt.gtk.linux.aarch64,:org.eclipse.swt.gtk.linux.ppc64le,:org.eclipse.swt.gtk.linux.riscv64,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.win32.win32.aarch64,:org.eclipse.swt.win32.win32.x86_64'
          GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
            bash releng/swt-receiver/retry-transient-maven-503.sh \
              mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
                -Dtycho.baseline.replace=none -DskipTests=true -Dmaven.test.skip=false \
                -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ \
                -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ \
                -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ \
                -pl "$swt_fragments" -am package
      - name: Run original SWT AllTests on the source-built GTK3 host
        id: swt-host
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The original test POM owns AllTests and retains -Xcheck:jni/strict checks.
          # Foreign fragments are resolution artifacts; only Linux GTK can execute here.
          # It rebuilds the GTK fragment that is bound below, so plugins resolve from
          # the same Maven Central overrides as the assembly step above.
          rm -rf .m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports
          proof="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/gtk-host-tests"
          mkdir -p "$proof/native"
          export SWT_GTK4=0 GDK_BACKEND=x11 GTK_VERSION=3.0
          export GTK_XCFLAGS=-Wno-deprecated-declarations
          export M3_HTTP503_ATTEMPTS=5 M3_HTTP503_RETRY_DELAY_SECONDS=15
          export M3_SWT_NATIVE_DIR="$PWD/.m3-swt/binaries/org.eclipse.swt.gtk.linux.x86_64"
          export M3_SWT_NATIVE_LOG="$proof/native/native-library-%p.log"
          # Host-only reactor, listed explicitly and without -am. In run 45433289163 the
          # -am closure of :org.eclipse.swt.tests also built org.eclipse.swt.gtk.linux.aarch64:
          # Tycho 5.0.4's TychoGraphBuilder adds -am dependency projects "without filtering
          # for the context", that is, without the linux/gtk/x86_64 environment. That jar was
          # surefire classpath entry 7, ahead of x86_64 (entry 138), so Library.class came
          # from a jar with SWT-Arch: aarch64 and Platform.exitIfNotLoadable() ended the JVM.
          # Excluding it with -pl '!:...' next to -am was refused (run 45441558339: "Could not
          # find the selected project in the reactor"). This list is run 45433289163's
          # reactor minus the aarch64 fragment. This step rebuilds org.eclipse.swt and the
          # gtk.linux.x86_64 fragment (the guard's package pass, then verify), and those are
          # the core and x86_64 jars that prepare_swt_receiver.py binds; the seven non-host
          # fragment jars it binds come from the assembly step above.
          export M3_SWT_HOST_PROJECTS=':eclipse.platform.swt,:org.eclipse.swt,:eclipse.platform.swt.binaries,:org.eclipse.swt.svg,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.tests'
          # Native flags for the forked test JVM. The test POM's argLine is
          # "@{tycho.testArgLine} -Xcheck:jni ... ${os-jvm-flags}". Surefire's @{...}
          # late replacement reads project properties, and the POM declares
          # tycho.testArgLine empty, so -Dtycho.testArgLine never reached the fork (run
          # 45433289163: no -Dswt.library.path or -Xlog:library on its command line).
          # ${os-jvm-flags} is interpolated when the model is built, where a -D user
          # property overrides the empty root-POM value (Linux has no profile value).
          export M3_SWT_TEST_JVM_FLAGS="-Dswt.library.path=$M3_SWT_NATIVE_DIR -Xlog:library=info:file=$M3_SWT_NATIVE_LOG"
          # Before any test runs, require the test bundle's resolved classpath to contain
          # exactly one SWT platform fragment, the source-built GTK x86_64 one
          # (releng/swt-receiver/verify_test_classpath.py, tested against run 45433289163).
          cp_file=.m3-swt/tests/org.eclipse.swt.tests/target/m3-test-classpath.txt
          rm -f "$cp_file"
          bash releng/swt-receiver/retry-transient-maven-503.sh \
            mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
              -Dtycho.baseline.replace=none -DskipTests=true -Dmaven.test.skip=false \
              -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ \
              -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ \
              -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ \
              -Dmdep.outputFile=target/m3-test-classpath.txt \
              -pl "$M3_SWT_HOST_PROJECTS" \
              package org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath
          python3 releng/swt-receiver/verify_test_classpath.py "$cp_file" "$M3_SWT_NATIVE_DIR"
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24 -noreset' \
            bash -ec '
              openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-swt-host-openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 100); do
                if wmctrl -m >/dev/null 2>&1; then break; fi
                sleep 0.1
              done
              wmctrl -m >/dev/null || { echo "native window manager unavailable" >&2; exit 1; }
              bash releng/swt-receiver/retry-transient-maven-503.sh \
                mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
                  -Dtycho.baseline.replace=none -DskipTests=false -Dmaven.test.skip=false \
                  -Dmaven.test.failure.ignore=false -DskipNativeTests=false -DfailIfNoTests=false \
                  -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ \
                  -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ \
                  -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ \
                  "-Dos-jvm-flags=$M3_SWT_TEST_JVM_FLAGS" \
                  -pl "$M3_SWT_HOST_PROJECTS" verify
            '
          python3 .m3-swt/tools/release/check_junit_coverage.py --strict \
            --reports-root .m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports \
            --json-out "$proof/original-sparse-coverage.json"
      - name: Bind receiver only after original GTK host tests succeed
        if: steps.swt-proof.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 releng/swt-receiver/prepare_swt_receiver.py \
            .m3-swt \
            releng/swt-receiver/swt-receiver-p2/target/binding \
            releng/swt-receiver/swt-receiver-p2/target/repository
          mvn -B -f releng/swt-receiver/swt-receiver-p2/pom.xml \
            "-Dm3.swt.source=$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
          python3 releng/swt-receiver/verify_gtk_host_tests.py capture \
            releng/swt-receiver/swt-receiver-p2/target --source .m3-swt
      - name: Verify SWT receiver from cache or source build
        shell: bash
        run: |
          set -euo pipefail
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
          python3 releng/swt-receiver/verify_gtk_host_tests.py verify \
            releng/swt-receiver/swt-receiver-p2/target
      - name: Retain qualified receiver for subsequent feature commits
        if: steps.swt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: nebula-swt3.138-gtk3-57efce1e-20261124-v2
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/
            releng/swt-receiver/swt-receiver-p2/target/repository/
      - name: Distribute pinned SWT and composite p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          retention-days: 30
          if-no-files-found: error
          path: |
            releng/swt-receiver/swt-receiver-p2/target/binding/composite/
            releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
            releng/swt-receiver/swt-receiver-p2/target/binding/gtk-host-tests/
            releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
            releng/swt-receiver/swt-receiver-p2/target/repository/
      - name: Preserve original GTK host test evidence
        if: always() && steps.swt-host.outcome != 'skipped' && steps.swt-proof.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nebula-original-swt-gtk-host-test-evidence
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports/
            releng/swt-receiver/swt-receiver-p2/target/binding/gtk-host-tests/

  vnc-protocol:
    needs: swt-receiver
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Bind pinned SWT p2 composite in identical checkout layout
        uses: actions/download-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          path: releng/swt-receiver/swt-receiver-p2/target
      - name: Validate SWT receiver and expose composite platform
        shell: bash
        run: |
          set -euo pipefail
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
          cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
      - name: Install SWT GTK3 native screen test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 dbus-x11 openbox wmctrl x11vnc
      - name: Verify RFB protocol and native screen pixels through Tycho
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24' \
            bash -ec '
              openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-vnc-openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 100); do
                if wmctrl -m >/dev/null 2>&1; then
                  break
                fi
                sleep 0.1
              done
              wmctrl -m >/dev/null || { echo "native window manager unavailable" >&2; exit 1; }
              # Use the real loopback-only x11vnc server on the current Xvfb.
              x11vnc -display "$DISPLAY" -localhost -nopw -forever -shared -rfbport 5913 -noxdamage >"${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" 2>&1 &
              vnc_pid=$!
              trap "kill $vnc_pid $wm_pid 2>/dev/null || true" EXIT
              ready=0
              for attempt in $(seq 1 100); do
                if (echo >/dev/tcp/127.0.0.1/5913) 2>/dev/null; then
                  ready=1
                  break
                fi
                if ! kill -0 "$vnc_pid" 2>/dev/null; then
                  cat "${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" >&2
                  exit 1
                fi
                sleep 0.1
              done
              if [ "$ready" != 1 ]; then
                cat "${RUNNER_TEMP:-/tmp}/nebula-x11vnc.log" >&2
                echo "Real VNC server did not bind loopback" >&2
                exit 1
              fi
              export NEBULA_RFB_REAL_SERVER_PORT=5913
              mvn -B -ntp -f widgets/vnc/pom.xml \
                -pl :org.eclipse.nebula.widgets.vnc.tests -am \
                -Dtycho.localArtifacts=ignore \
                "-Dtarget-platform-platform=$M3_SWT_PLATFORM" \
                -DfailIfNoTests=true clean verify
            '
      - name: Require all protocol test classes with no failures or skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target')
          reports = sorted(root.rglob('TEST-*.xml'))
          assert reports, 'no JUnit XML reports: tests were not executed'
          found, executed = set(), 0
          for file in reports:
              elem = ET.parse(file).getroot()
              if elem.tag == 'testsuites':
                  suites = list(elem.findall('testsuite'))
              else:
                  suites = [elem]
              for suite in suites:
                  name = suite.attrib.get('name', '')
                  found.add(name.rsplit('.', 1)[-1])
                  counts = {k: int(suite.attrib.get(k, '0'))
                            for k in ('tests','failures','errors','skipped')}
                  assert counts['failures'] == 0 and counts['errors'] == 0, file
                  assert counts['skipped'] == 0, f'skipped tests in {file}'
                  executed += counts['tests']
          required = {'RfbClientTest', 'RfbClientAdvancedTest',
                      'RfbTileDecoderTest', 'RfbVeNCryptTest',
                      'RfbFrameDamageTest',
                      'RfbCodecPropertyTest', 'RfbQueueBudgetTest',
                      'VncCanvasNativeTest', 'RfbRealServerTest',
                      'RfbTightDecoderTest', 'RfbCursorDecoderTest',
                      'RfbHextileDecoderTest', 'RfbKeysymTest',
                      'VncCursorNativeTest'}
          assert required <= found, f'missing tests: {required - found}'
          assert executed >= 45, f'expected at least 45 tests, got {executed}'
          print('NEBULA_RFB_TYCHO_PROTOCOL_TESTS=PASSED', executed)
          PY
      - name: Upload protocol test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-rfb-protocol-test-reports
          if-no-files-found: warn
          path: |
            widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target/surefire-reports/
            widgets/vnc/org.eclipse.nebula.widgets.vnc.tests/target/**/*.log

  terminal-compile:
    needs: swt-receiver
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned Maven 3.9.11 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          expected=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          base="apache-maven-$version-bin.tar.gz"
          success=0
          for url in \
            "https://archive.apache.org/dist/maven/maven-3/$version/binaries/$base" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$base"; do
            if curl --fail --location --silent --show-error --retry 6 --retry-delay 5 \
                --retry-all-errors --connect-timeout 20 --max-time 160 \
                "$url" --output "$archive" \
                && printf '%s  %s\n' "$expected" "$archive" | sha512sum --check --status; then
              success=1
              break
            fi
            rm -f "$archive"
          done
          test "$success" = 1 || { echo "Verified Maven 3.9.11 unavailable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin/mvn" -version
      - name: Bind pinned SWT p2 composite in identical checkout layout
        uses: actions/download-artifact@v4
        with:
          name: nebula-terminal-vnc-pinned-swt
          path: releng/swt-receiver/swt-receiver-p2/target
      - name: Validate SWT receiver and expose composite platform
        shell: bash
        run: |
          set -euo pipefail
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/composite/compositeContent.xml
          test -f releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env
          python3 releng/swt-receiver/verify_reusable_receiver.py \
            releng/swt-receiver/swt-receiver-p2/target
          cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
      - name: Install SWT GTK3 Terminal native acceptance dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 dbus-x11 openbox wmctrl
      - name: Compile and test embedded Eclipse Terminal on native SWT
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24' \
            bash -ec '
              openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-terminal-openbox.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 100); do
                if wmctrl -m >/dev/null 2>&1; then
                  break
                fi
                sleep 0.1
              done
              wmctrl -m >/dev/null || { echo "native window manager unavailable" >&2; exit 1; }
              M3_HTTP503_ATTEMPTS=3 M3_HTTP503_RETRY_DELAY_SECONDS=12 \
                bash releng/swt-receiver/retry-transient-maven-503.sh \
                  mvn -B -U -ntp -f widgets/terminal/pom.xml \
                    -pl :org.eclipse.nebula.widgets.terminal.tests -am \
                    -Dtycho.localArtifacts=ignore \
                    "-Dtarget-platform-platform=$M3_SWT_PLATFORM" \
                    -DfailIfNoTests=true clean verify
            '
      - name: Require parent-cascade and direct Terminal resource tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target')
          reports = sorted(root.rglob('TEST-*.xml'))
          assert reports, 'no Terminal JUnit XML reports'
          executed, seen = 0, set()
          for file in reports:
              tree = ET.parse(file).getroot()
              suites = list(tree.findall('testsuite')) if tree.tag == 'testsuites' else [tree]
              for suite in suites:
                  seen.add(suite.attrib.get('name','').rsplit('.',1)[-1])
                  tests = int(suite.attrib.get('tests',0))
                  failures = int(suite.attrib.get('failures',0))
                  errors = int(suite.attrib.get('errors',0))
                  skips = int(suite.attrib.get('skipped',0))
                  assert tests > 0 and not (failures or errors or skips), file
                  executed += tests
          assert 'TerminalWidgetNativeTest' in seen
          assert executed >= 2, f'expected two Terminal lifecycle cases, got {executed}'
          print('NEBULA_TERMINAL_NATIVE=PASSED', executed)
          PY
      - name: Upload Terminal native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-terminal-native-test-reports
          if-no-files-found: warn
          path: |
            widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target/surefire-reports/
            widgets/terminal/org.eclipse.nebula.widgets.terminal.tests/target/**/*.log
