name: Nebula Grid exact generated count receiving
on:
  push:
    branches: ['m3/grid-row-count-master-20261022-01']
  pull_request:
    paths:
      - 'm3/qualification/grid-row-count-master-20261022/**'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridRowAddressedItemDataVisualizer.java'
      - '.github/workflows/grid-row-count-master-20261022.yml'
permissions: { contents: read }
jobs:
  canonical-sdk-then-receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Seal current exact input and canonical engine
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object m3/qualification/grid-row-count-master-20261022/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java)" = 79ed66fc4547d30f0e74392f2963f9b30c4a33f8
          test "$(git hash-object m3/qualification/grid-row-count-master-20261022/src/main/java/com/synexia/rewrite/M3ScopeInference.java)" = 50b4b9c129a88f930fca450981e492ae0c60b77e
          test "$(git hash-object m3/qualification/grid-row-count-master-20261022/src/main/java/com/synexia/rewrite/M3EditScope.java)" = 274360816db1e44a2f1796a3bc5cdeff6b0ce6db
      - name: Execute actual Maven OpenRewrite source generator and seven SDK tests
        run: mvn -B -ntp -f m3/qualification/grid-row-count-master-20261022/pom.xml clean test
      - name: Verify exact generated source without JNI claims
        run: |
          set -euo pipefail
          GENERATED='m3/qualification/grid-row-count-master-20261022/target/generated-receiver/widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridRowAddressedItemDataVisualizer.java'
          echo "eb609f07d7fd3e0ee0fe3da143f2de6378f34dfd71518a65c91647b43c38497b  $GENERATED" | sha256sum -c -
          cmp "$GENERATED" 'm3/qualification/grid-row-count-master-20261022/src/main/resources/com/synexia/rewrite/hash-pinned-java/grid-row-count-master-20261022/GridRowAddressedItemDataVisualizer.java.txt'
          echo 'ACTUAL_OPENREWRITE_GENERATED_SOURCE_PASS'
      - name: Require exact installed product receiver before full check success
        run: |
          set -euo pipefail
          TARGET='widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridRowAddressedItemDataVisualizer.java'
          GENERATED='m3/qualification/grid-row-count-master-20261022/target/generated-receiver/'"$TARGET"
          cmp "$GENERATED" "$TARGET"
          echo 'EXACT_RECEIVED_NEBULA_OWNER_PASS'
