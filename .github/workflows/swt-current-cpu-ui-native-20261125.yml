# SPDX-License-Identifier: EPL-2.0
name: SWT current-source CPU ImageLayers and UI-thread GTK3 JUnit
on:
  push:
    branches: ['ci/swt-current-cpu-ui-gtk3-20261125']
  pull_request:
    paths:
      - '.github/workflows/swt-current-cpu-ui-native-20261125.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  exact-original-swt-gtk3:
    if: github.repository == 'hsoliwal/nebula'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install SHA-512-pinned Maven 3.9.11 from original receiver
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.11
          sum=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          success=0
          for url in "https://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/apache-maven-$version-bin.tar.gz"; do
            if curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 160 "$url" -o "$archive" && printf '%s  %s\n' "$sum" "$archive" | sha512sum --check --status; then success=1; break; fi
            rm -f "$archive"
          done
          test "$success" = 1
          mkdir -p "$RUNNER_TEMP/maven-pinned"
          tar -xzf "$archive" -C "$RUNNER_TEMP/maven-pinned"
          echo "$RUNNER_TEMP/maven-pinned/apache-maven-$version/bin" >> "$GITHUB_PATH"
      - name: Checkout current immutable SWT source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 448e608f812d9a39a39b3054f0b085a4ae171338
          path: .m3-swt
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout original Eclipse parent
        uses: actions/checkout@v4
        with:
          repository: eclipse-platform/eclipse.platform.releng.aggregator
          ref: 8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec
          path: .m3-eclipse-releng
          sparse-checkout: eclipse-platform-parent
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact original SWT and Eclipse parent identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .m3-swt rev-parse HEAD)" = "448e608f812d9a39a39b3054f0b085a4ae171338"
          test "$(git hash-object .m3-swt/pom.xml)" = "341c07d199041c55d89a99fcc93560074e425716"
          test "$(git -C .m3-eclipse-releng rev-parse HEAD)" = "8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec"
          parent=.m3-eclipse-releng/eclipse-platform-parent/pom.xml
          test "$(git hash-object "$parent")" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
          printf '%s  %s\n' 121b6c26d986874391d26d114377e3beda91723b0d675146bdd194dbfe01e264 "$parent" | sha256sum --check
          printf '%s  %s\n' 51ccf2acd0c803258f1c9cee09f42f6806bd05eddae8cd176e9178414768c8c9 ".m3-swt/bundles/org.eclipse.swt/Eclipse SWT/gtk/org/eclipse/swt/graphics/GC.java" | sha256sum --check
          test ! -e eclipse-platform-parent
          mkdir -p eclipse-platform-parent
          cp "$parent" eclipse-platform-parent/pom.xml
          python3 - <<'PY'
          from xml.etree import ElementTree as E
          p=E.parse(".m3-swt/pom.xml").getroot()
          parent=E.parse("eclipse-platform-parent/pom.xml").getroot()
          ns="{http://maven.apache.org/POM/4.0.0}"
          for item in ("groupId","artifactId","version"):
              assert p.find(ns+"parent/"+ns+item).text.strip()==parent.find(ns+item).text.strip()
          print("SWT_CURRENT_SOURCE_PIN_PASS")
          PY
      - name: Prepare real GTK3 and original Maven retry helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev freeglut3-dev libwebkit2gtk-4.1-0 xvfb dbus-x11 openbox wmctrl
          bash releng/swt-receiver/test-retry-transient-maven-503.sh
      - name: Build original SWT 3.138 core and all eight fragments
        shell: bash
        run: |
          set -euo pipefail
          export M3_HTTP503_ATTEMPTS=5 M3_HTTP503_RETRY_DELAY_SECONDS=15
          fragments=':org.eclipse.swt.cocoa.macosx.aarch64,:org.eclipse.swt.cocoa.macosx.x86_64,:org.eclipse.swt.gtk.linux.aarch64,:org.eclipse.swt.gtk.linux.ppc64le,:org.eclipse.swt.gtk.linux.riscv64,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.win32.win32.aarch64,:org.eclipse.swt.win32.win32.x86_64'
          GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations bash releng/swt-receiver/retry-transient-maven-503.sh mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 -Dtycho.baseline.replace=none -DskipTests=true -Dmaven.test.skip=false -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ -pl "$fragments" -am package
      - name: Execute three original JUnit classes with built GTK3 natives
        shell: bash
        run: |
          set -euo pipefail
          export SWT_GTK4=0 GDK_BACKEND=x11 GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations
          export M3_HTTP503_ATTEMPTS=5 M3_HTTP503_RETRY_DELAY_SECONDS=15
          export NATIVE_DIR="$PWD/.m3-swt/binaries/org.eclipse.swt.gtk.linux.x86_64"
          export HOST_PROJECTS=':eclipse.platform.swt,:org.eclipse.swt,:eclipse.platform.swt.binaries,:org.eclipse.swt.svg,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.tests'
          export NATIVE_FLAGS="-Dswt.library.path=$NATIVE_DIR -Xlog:library=info:file=$RUNNER_TEMP/swt-current-native-%p.log"
          export TARGET_TESTS='Test_org_eclipse_swt_widgets_Synchronizer,Test_ViewportImageLayers,Test_org_eclipse_swt_custom_LayeredViewport'
          cp_file=.m3-swt/tests/org.eclipse.swt.tests/target/m3-test-classpath.txt
          rm -f "$cp_file"
          bash releng/swt-receiver/retry-transient-maven-503.sh mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 -Dtycho.baseline.replace=none -DskipTests=true -Dmaven.test.skip=false -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ -Dmdep.outputFile=target/m3-test-classpath.txt -pl "$HOST_PROJECTS" package org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath
          python3 releng/swt-receiver/verify_test_classpath.py "$cp_file" "$NATIVE_DIR"
          rm -rf .m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1280x800x24 -noreset' bash -ec '
            openbox --sm-disable >"$RUNNER_TEMP/swt-current-openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 100); do
              if wmctrl -m >/dev/null 2>&1; then break; fi
              sleep 0.1
            done
            wmctrl -m >/dev/null || exit 1
            bash releng/swt-receiver/retry-transient-maven-503.sh mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 -Dtycho.baseline.replace=none -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false -DskipNativeTests=false -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ "-Dos-jvm-flags=$NATIVE_FLAGS" "-Dtest=$TARGET_TESTS" -pl "$HOST_PROJECTS" verify
          '
      - name: Require original native JUnit reports and scoped GTK skip reasons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          root=Path(".m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports")
          # These two methods are platform assumptions in the pinned SWT sources.
          expected={"Test_org_eclipse_swt_widgets_Synchronizer":(24,set()),
                    "Test_ViewportImageLayers":(36,set()),
                    "Test_org_eclipse_swt_custom_LayeredViewport":(233,{
                        "testNativeBorderReentrancyCoalescesViewportFrame",
                        "test_nativeBorderRelief_cocoaNativeBezel"})}
          for name,(tests,allowed_skips) in expected.items():
              suite="org.eclipse.swt.tests.junit."+name
              file=root/("TEST-"+suite+".xml")
              if not file.is_file():raise SystemExit("FAIL missing native JUnit "+name)
              report=E.parse(file).getroot()
              if report.tag!="testsuite" or report.get("name")!=suite:raise SystemExit("FAIL native JUnit suite identity "+name)
              counters=tuple(int(report.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
              if counters!=(tests,0,0,len(allowed_skips)):raise SystemExit("FAIL native JUnit "+name+" "+str(counters))
              cases=report.findall("testcase")
              if len(cases)!=tests or len(report.findall(".//testcase"))!=tests:raise SystemExit("FAIL missing executed JUnit cases "+name)
              identities=[(case.get("classname"),case.get("name")) for case in cases]
              if len(set(identities))!=tests or any(owner!=suite or not method or not method.strip() for owner,method in identities):raise SystemExit("FAIL native JUnit case identity "+name)
              if report.find(".//failure") is not None or report.find(".//error") is not None:raise SystemExit("FAIL native JUnit case failure/error "+name)
              skipped={case.get("name") for case in cases if case.find("skipped") is not None}
              if skipped!=allowed_skips:raise SystemExit("FAIL unexpected native JUnit skipped methods "+name+" "+str(sorted(skipped)))
              reasons=[s.get("message") or s.text or "" for case in cases for s in case.findall("skipped")]
              if len(reasons)!=len(allowed_skips) or len(report.findall(".//skipped"))!=len(allowed_skips) or any(not reason.strip() for reason in reasons):raise SystemExit("FAIL invalid skip reason "+name)
          for file in root.glob("TEST-org.eclipse.swt.tests.junit.*.xml"):
              report=E.parse(file).getroot()
              if int(report.get("failures","0")) or int(report.get("errors","0")) or report.find(".//failure") is not None or report.find(".//error") is not None:raise SystemExit("FAIL other SWT test "+file.name)
          print("SWT_CURRENT_CPU_UI_NATIVE_GTK3_PASS synchronizer=24 cpu=36 layered=231 gtkSkipped=2")
          PY
      - name: Retain original native JUnit XML and kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swt-current-cpu-ui-gtk3-native
          path: .m3-swt/tests/org.eclipse.swt.tests/target/surefire-reports/**
          if-no-files-found: warn
