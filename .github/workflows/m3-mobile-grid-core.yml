name: Nebula mobile Grid viewport Java 21 qualification
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/m3-mobile-grid-core.yml']
  push:
    paths: ['mobile/**', '.github/workflows/m3-mobile-grid-core.yml']
jobs:
  mobile-grid-java-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sparse native-row geometry and model proof
        run: bash mobile/test-core.sh
