name: Java CI with Maven

on:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      SWT_GTK4: "0"
      GDK_BACKEND: x11
    strategy:
      matrix:
        java: [ '21' ]
    name: Java ${{ matrix.java }} compile
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Set up Maven
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
      with:
        maven-version: 3.9.11
    - name: Checkout the qualified SWT receiver
      uses: actions/checkout@v4
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: 717f952621852850b68c0c301fca7c6d41a68039
        path: .m3-swt
        fetch-depth: 0
        lfs: false
    - name: Build and bind the pinned SWT GTK3 distribution
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev
        GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
          mvn -B -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
          -Dtycho.baseline.replace=none -pl :org.eclipse.swt.gtk.linux.x86_64 -am package
        python3 m3/convergence/prepare_swt_receiver.py .m3-swt m3/convergence/swt-receiver-p2/target/binding \
          m3/convergence/swt-receiver-p2/target/repository
        mvn -B -f m3/convergence/swt-receiver-p2/pom.xml \
          -Dm3.swt.source="$PWD/m3/convergence/swt-receiver-p2/target/binding/input" verify
        cat m3/convergence/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
    - name: Build All Widgets
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
      with:
       run: mvn -V -B clean verify -Dtycho.localArtifacts=ignore -Dnebula.grid.viewport.screenshots.screen=true -Dnebula.swt.gc.sha256=${{ env.M3_SWT_GC_SHA256 }} -Dtarget-platform-platform=${{ env.M3_SWT_PLATFORM }}
    - name: Qualify Grid native screen pixels with OpenCV
      run: |
        python3 -m venv /tmp/nebula-vision
        /tmp/nebula-vision/bin/pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
        /tmp/nebula-vision/bin/python m3/convergence/verify_grid_screenshots.py \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports \
          m3/convergence/swt-receiver-p2/target/binding/expected.json
    - name: Upload Grid visible-range screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grid-visible-range-screenshots
        if-no-files-found: warn
        path: |
          m3/convergence/swt-receiver-p2/target/binding/expected.json
          m3/convergence/swt-receiver-p2/target/repository/*.xml
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports/
