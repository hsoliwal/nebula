name: Java CI with Maven

on:
  workflow_call:
    inputs:
      release_verification:
        description: Execute all active widget test modules with failures fatal
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-browser-cpu-junit:
    # This independent source/JUnit gate must not depend on Eclipse snapshot
    # resolution. It does NOT replace the SWT/Tycho/native build below.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Maven 3.9.11
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.11
      - name: Verify remote browser CPU decoder and frame geometry with real JUnit4
        shell: bash
        run: |
          set -euo pipefail
          production=widgets/drawnbrowser/org.eclipse.nebula.widgets.drawnbrowser/src/org/eclipse/nebula/widgets/drawnbrowser/internal
          tests=widgets/drawnbrowser/org.eclipse.nebula.widgets.drawnbrowser.tests/src/org/eclipse/nebula/widgets/drawnbrowser/internal
          if [[ ! -f "$production/RemoteFrameDecode.java" ]]; then
            echo 'NOT_APPLICABLE: no RemoteFrameDecode.java on this ref (not a passing decoder acceptance test)'
            exit 0
          fi
          for source in "$production/RemoteFrameDecode.java" "$production/RemoteFrameWindow.java" \
              "$tests/RemoteFrameDecodeTest.java" "$tests/RemoteFrameWindowTest.java"; do
            if [[ ! -f "$source" ]]; then
              echo "INCOMPLETE_DECODER_PROOF: missing $source" >&2
              exit 1
            fi
          done
          work="$RUNNER_TEMP/nebula-remote-cpu-junit"
          pkg=org/eclipse/nebula/widgets/drawnbrowser/internal
          mkdir -p "$work/src/main/java/$pkg" "$work/src/test/java/$pkg"
          cp "$production/RemoteFrameDecode.java" "$production/RemoteFrameWindow.java" \
            "$work/src/main/java/$pkg/"
          cp "$tests/RemoteFrameDecodeTest.java" "$tests/RemoteFrameWindowTest.java" \
            "$work/src/test/java/$pkg/"
          cat > "$work/pom.xml" <<'M3_POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.eclipse.nebula.verification</groupId>
            <artifactId>remote-browser-cpu-junit</artifactId>
            <version>2026.11.23</version>
            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencies>
              <dependency><groupId>junit</groupId><artifactId>junit</artifactId>
                <version>4.13.2</version><scope>test</scope></dependency>
            </dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-compiler-plugin</artifactId><version>3.14.1</version>
                <configuration><release>21</release>
                  <compilerArgs><arg>-Xlint:all</arg><arg>-Werror</arg></compilerArgs>
                </configuration>
              </plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-surefire-plugin</artifactId><version>3.5.4</version>
                <configuration><failIfNoTests>true</failIfNoTests></configuration>
              </plugin>
            </plugins></build>
          </project>
          M3_POM
          mvn -B -ntp -f "$work/pom.xml" clean test -Dstyle.color=never
          python3 - "$work/target/surefire-reports" <<'M3_CHECK'
          import pathlib, sys, xml.etree.ElementTree as ET
          folder = pathlib.Path(sys.argv[1])
          tests = errors = failures = skipped = 0
          files = list(folder.glob('TEST-*.xml'))
          for path in files:
              suite = ET.parse(path).getroot()
              tests += int(suite.attrib.get('tests', 0))
              errors += int(suite.attrib.get('errors', 0))
              failures += int(suite.attrib.get('failures', 0))
              skipped += int(suite.attrib.get('skipped', 0))
          if len(files) != 2 or tests < 10 or errors or failures or skipped:
              raise SystemExit(f'INCOMPLETE_CPU_JUNIT files={len(files)} tests={tests} '
                               f'errors={errors} failures={failures} skipped={skipped}')
          print(f'NEBULA_REMOTE_CPU_JUNIT_PASS suites={len(files)} tests={tests} '
                f'errors={errors} failures={failures} skipped={skipped}; '
                'SWT_NATIVE_NOT_QUALIFIED')
          M3_CHECK

  build:
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-24.04
    env:
      SWT_GTK4: "0"
      GDK_BACKEND: x11
    strategy:
      matrix:
        java: [ '21' ]
    name: Java ${{ matrix.java }} compile
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Verify preinstalled Maven (avoid rate-limited Maven Central archive)
      shell: bash
      run: |
        set -euo pipefail
        mvn -version | tee "$RUNNER_TEMP/nebula-maven-version.txt"
        grep -Eq '^Apache Maven 3[.](9|10)[.]' "$RUNNER_TEMP/nebula-maven-version.txt"
    - name: Checkout the qualified SWT receiver
      uses: actions/checkout@v4
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: d2566c5b84bdd46f22ee2bbf34d3432115787e94
        path: .m3-swt
        fetch-depth: 0
        lfs: false
    # Parent source is a separate original Eclipse EDL-1.0 project, not Synexia code.
    # The SWT POM requests ../eclipse-platform-parent; keep the exact source identity.
    - name: Checkout exact Eclipse 4.42 parent source
      uses: actions/checkout@v4
      with:
        repository: eclipse-platform/eclipse.platform.releng.aggregator
        ref: 8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec
        path: .m3-eclipse-releng
        sparse-checkout: eclipse-platform-parent
        sparse-checkout-cone-mode: true
        fetch-depth: 1
        persist-credentials: false
        lfs: false
    - name: Bind pinned upstream Eclipse parent without changing SWT source
      shell: bash
      run: |
        set -euo pipefail
        src=.m3-eclipse-releng/eclipse-platform-parent/pom.xml
        test "$(git -C .m3-eclipse-releng rev-parse HEAD)" = "8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec"
        test "$(git hash-object "$src")" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
        printf '%s  %s\n' "121b6c26d986874391d26d114377e3beda91723b0d675146bdd194dbfe01e264" "$src" | sha256sum --check
        test "$(git -C .m3-swt rev-parse HEAD)" = "d2566c5b84bdd46f22ee2bbf34d3432115787e94"
        test "$(git hash-object .m3-swt/pom.xml)" = "341c07d199041c55d89a99fcc93560074e425716"
        test ! -e eclipse-platform-parent
        mkdir -p eclipse-platform-parent
        cp "$src" eclipse-platform-parent/pom.xml
        test "$(git hash-object eclipse-platform-parent/pom.xml)" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
        python3 - <<'PY'
        from pathlib import Path
        from xml.etree import ElementTree as ET
        ns = "{http://maven.apache.org/POM/4.0.0}"
        parent = ET.parse("eclipse-platform-parent/pom.xml").getroot()
        swt = ET.parse(".m3-swt/pom.xml").getroot()
        def value(element, path):
            node = element.find(path)
            return node.text.strip() if node is not None and node.text else None
        assert (value(parent, ns+"groupId"), value(parent, ns+"artifactId"),
                value(parent, ns+"version"), value(parent, ns+"packaging")) == (
                    "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT", "pom")
        expected = swt.find(ns+"parent")
        assert expected is not None
        assert (value(expected, ns+"groupId"), value(expected, ns+"artifactId"),
                value(expected, ns+"version"), value(expected, ns+"relativePath")) == (
                    "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT",
                    "../eclipse-platform-parent")
        assert "Eclipse Distribution License v1.0" in Path("eclipse-platform-parent/pom.xml").read_text()
        print("SWT_LOCAL_PARENT_SOURCE_IDENTITY=PASS")
        PY
    - name: Verify Eclipse parent source before building pinned SWT
      shell: bash
      run: |
        set -euo pipefail
        python3 -m unittest discover -s releng/swt-receiver -p 'test_prepare_eclipse_platform_parent.py'
        python3 releng/swt-receiver/prepare_eclipse_platform_parent.py .m3-eclipse-releng .m3-swt
    - name: Qualify fail-closed HTTP 429/502/503/504 retry behavior
      run: bash releng/swt-receiver/test-retry-transient-maven-503.sh
    - name: Build and bind the pinned SWT GTK3 distribution
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev
        # Build every source-pinned SWT platform fragment expected by the P2
        # receiver. Only GTK x86_64 compiles native .so files on this host;
        # Cocoa/Win32/other architectures are Java/OSGi resolution inputs only.
        swt_fragments=':org.eclipse.swt.cocoa.macosx.aarch64,:org.eclipse.swt.cocoa.macosx.x86_64,:org.eclipse.swt.gtk.linux.aarch64,:org.eclipse.swt.gtk.linux.ppc64le,:org.eclipse.swt.gtk.linux.riscv64,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.win32.win32.aarch64,:org.eclipse.swt.win32.win32.x86_64'
        GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
          bash releng/swt-receiver/retry-transient-maven-503.sh \
          mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
          -Dtycho.baseline.replace=none -DskipTests=true \
          -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ \
          -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ \
          -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ \
          -pl "$swt_fragments" -am package
        python3 releng/swt-receiver/prepare_swt_receiver.py .m3-swt releng/swt-receiver/swt-receiver-p2/target/binding \
          releng/swt-receiver/swt-receiver-p2/target/repository
        bash releng/swt-receiver/retry-transient-maven-503.sh mvn -B -U -f releng/swt-receiver/swt-receiver-p2/pom.xml \
          -Dm3.swt.source="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
        cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
    # Nebula's Tycho 4.0.12 reactor requires an independently pinned Maven
    # toolchain; the SWT Tycho 5.0.4 source build above uses the newer runner.
    # Maven 3.10.1 + Tycho 4.0.12 failed injecting MavenTargetLocationFactory.
    - name: Set up Maven 3.9.11 for Nebula Tycho 4.0.12
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
      with:
        maven-version: 3.9.11
    - name: Qualify legacy Tycho/Maven pairing before native widget tests
      shell: bash
      run: |
        set -euo pipefail
        grep -Fx -- '-Dtycho-version=4.0.12' .mvn/maven.config
        mvn -version | tee "$RUNNER_TEMP/nebula-legacy-tycho-maven.txt"
        grep -Eq '^Apache Maven 3[.]9[.]11([[:space:]]|$)' "$RUNNER_TEMP/nebula-legacy-tycho-maven.txt"
    - name: Run the excluded DrawnBrowser reactor under pinned GTK3/X11
      shell: bash
      run: |
        set -euo pipefail
        # The root Nebula <modules> list omits widgets/drawnbrowser.
        # Qualify the original HTML renderer explicitly with its real native SWT dependencies.
        sudo apt-get install -y xvfb x11-xserver-utils openbox wmctrl
        xvfb-run --auto-servernum bash -c '
          set -euo pipefail
          openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/drawnbrowser-openbox.log" 2>&1 &
          wm_pid=$!
          trap "kill $wm_pid 2>/dev/null || true" EXIT
          for attempt in $(seq 1 100); do
            if wmctrl -m >/dev/null 2>&1; then break; fi
            kill -0 "$wm_pid" 2>/dev/null || exit 1
            sleep 0.1
          done
          wmctrl -m
          "$@"
        ' drawnbrowser-wm bash releng/swt-receiver/retry-transient-maven-503.sh mvn -V -B -U --fail-at-end -f widgets/drawnbrowser/pom.xml clean verify \
          -Dtycho.localArtifacts=ignore \
          -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false \
          -Dtests.vmargs=-Xcheck:jni \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing pinned GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing platform}"
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET
        reports = sorted(glob.glob('widgets/drawnbrowser/**/target/surefire-reports/TEST-*.xml', recursive=True))
        if not reports:
            sys.exit('FAIL: absent DrawnBrowser native JUnit reports')
        tests = failed = skipped = 0
        required_classes = {
            'DrawnBrowserFormPositionTest',
            'DrawnBrowserStackingCompositionTest',
            'HtmlControlLayoutTest',
            'HtmlControlStylesTest',
            'HtmlStackingCompositionTest',
        }
        required_hidden = {
            'hiddenPanelCanProgrammaticallyScrollWithoutGrowingOuterDocument',
            'panelsCanScrollTheirOwnTextWithoutMovingTheirBorder',
            'clipPanelRejectsProgrammaticScrollAndHasNoScrollLimit',
            'panelOffsetIsClampedPreservedOnRelayoutAndReturnedToZero',
            'fixedDescendantDoesNotMoveWithAnUnrelatedHiddenPanelScroll',
        }
        required_auto = {
            ('HtmlStylesTest', 'overflowScrollModesDoNotAliasTheMaskOrInherit'),
            ('HtmlPositionedGeometryTest', 'hiddenProgrammaticScrollPreservesTheParentBorderButClipRefusesScroll'),
            ('HtmlPositionedGeometryTest', 'autoAndScrollPanelsConsumeWheelWithoutMovingRoot'),
            ('HtmlPositionedGeometryTest', 'nestedPanelScrollOffsetsAddAndFixedChildrenEscapeThem'),
            ('DrawnBrowserPositionedTest', 'nestedWheelScrollMovesPanelPixelsWithoutMovingTheRootPage'),
        }
        required_chrome = ('DrawnBrowserTest', 'gtkScrollbarChromeDoesNotOverlayThePixelScrollViewport')
        seen_classes, seen_hidden, seen_auto = set(), set(), set()
        seen_chrome = False
        for f in reports:
            root = ET.parse(f).getroot()
            suites = [root] if root.tag.endswith('testsuite') else list(root)
            for suite in suites:
                if suite.tag.endswith('testsuite'):
                    tests += int(suite.get('tests', '0'))
                    failed += int(suite.get('failures', '0')) + int(suite.get('errors', '0'))
                    skipped += int(suite.get('skipped', '0'))
            for case in root.iter('testcase'):
                cls = case.attrib.get('classname', '').rsplit('.', 1)[-1]
                name = case.attrib.get('name', '')
                seen_classes.add(cls)
                if cls == 'HtmlPositionedGeometryTest':
                    seen_hidden.add(name)
                if (cls, name) in required_auto:
                    seen_auto.add((cls, name))
                if (cls, name) == required_chrome:
                    seen_chrome = True
        missing_classes = sorted(required_classes - seen_classes)
        missing_hidden = sorted(required_hidden - seen_hidden)
        missing_auto = sorted(required_auto - seen_auto)
        print(f'DrawnBrowser native tests={tests} failures+errors={failed} skipped={skipped} '
              f'missing_classes={missing_classes} missing_hidden={missing_hidden} '
              f'missing_auto={missing_auto} chrome_test_seen={seen_chrome}')
        if tests < 399 or failed or skipped or missing_classes or missing_hidden or missing_auto or not seen_chrome:
            sys.exit('FAIL: require >=399 real native cases, five native classes, five hidden tests, '
                     'five auto/scroll tests, GTK scrollbar chrome regression, zero failed/skipped')
        PY
    - name: Build All Widgets
      shell: bash
      env:
        M3_RELEASE_VERIFICATION: ${{ inputs.release_verification }}
      run: |
        set -euo pipefail
        release_flags=()
        if [[ "${M3_RELEASE_VERIFICATION:-}" == "true" ]]; then
          release_flags=(-DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false)
        fi
        sudo apt-get install -y xvfb x11-xserver-utils openbox wmctrl
        # A real X11 window manager must deliver native Iconify/Deiconify; xvfb alone
        # supplies a display but does not provide window-management transitions.
        xvfb-run --auto-servernum bash -c '
          set -euo pipefail
          openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-openbox.log" 2>&1 &
          wm_pid=$!
          trap "kill $wm_pid 2>/dev/null || true" EXIT
          for attempt in $(seq 1 100); do
            if wmctrl -m >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              echo "openbox exited before becoming the X11 window manager" >&2
              exit 1
            fi
            sleep 0.1
          done
          if ! wmctrl -m; then
            echo "no native window manager registered on $DISPLAY" >&2
            exit 1
          fi
          "$@"
        ' nebula-wm bash releng/swt-receiver/retry-transient-maven-503.sh mvn -V -B -U --fail-at-end clean verify "${release_flags[@]}" \
          -Dtycho.localArtifacts=ignore \
          -Dnebula.grid.viewport.screenshots.screen=true \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing SWT GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing SWT platform}" \
          "-Dm3.test.pixels.dir=${RUNNER_TEMP:?missing runner temp}/nebula-widget-pixels"
    # Index exact original Tycho/JUnit XML when the reactor reports native
    # failures. This cannot make a failed Build All Widgets step succeed.
    - name: Index native JUnit failures without changing the Maven verdict
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        classes="$RUNNER_TEMP/native-test-diagnostics-classes"
        out="$RUNNER_TEMP/native-test-diagnostics"
        mkdir -p "$classes" "$out"
        javac --release 21 -Xlint:all -Werror -d "$classes" \
          releng/native-test-diagnostics/src/main/java/org/eclipse/nebula/releng/NativeTestFailureIndex.java \
          releng/native-test-diagnostics/src/test/java/org/eclipse/nebula/releng/NativeTestFailureIndexTest.java
        java -ea -cp "$classes" org.eclipse.nebula.releng.NativeTestFailureIndexTest
        java -cp "$classes" org.eclipse.nebula.releng.NativeTestFailureIndex \
          widgets "$out/native-test-failures.tsv" "$out/native-test-summary.md"
        cat "$out/native-test-summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload original native JUnit failure index
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-native-failure-index
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/native-test-diagnostics/native-test-failures.tsv
          ${{ runner.temp }}/native-test-diagnostics/native-test-summary.md
    - name: Index original native Surefire failures without changing Tycho verdict
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        classes="${RUNNER_TEMP:?}/nebula-native-failure-index-classes"
        destination="${RUNNER_TEMP:?}/nebula-native-failure-index"
        mkdir -p "$classes" "$destination"
        javac --release 21 -Xlint:all -Werror -d "$classes" \
          releng/swt-receiver/NativeFailureIndex.java \
          releng/swt-receiver/NativeFailureIndexTest.java
        java -ea -cp "$classes" NativeFailureIndexTest
        java -cp "$classes" NativeFailureIndex "$PWD" "$destination"
        cat "$destination/summary.md" >> "${GITHUB_STEP_SUMMARY:?}"
    # Distinct artifact name: upload-artifact@v4 refuses a second
    # nebula-native-failure-index artifact in the same workflow run.
    - name: Upload native Surefire failure index and original report hashes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-native-surefire-failure-index
        if-no-files-found: error
        path: ${{ runner.temp }}/nebula-native-failure-index/
    # A full reactor may fail in an unrelated widget: keep the two original
    # SCREEN method receipts independently fatal and independently visible.
    - name: Require executed GradientChooser and HeatMap visible-screen JUnit
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'M3_NATIVE_SCREEN_JUNIT'
        # SPDX-License-Identifier: Apache-2.0
        """Require original GC(Display) JUnit4 reports without synthesizing a pass."""
        from pathlib import Path
        import xml.etree.ElementTree as ET
        
        CASES = (
            (
                "widgets/opal/gradientchooser/org.eclipse.nebula.widgets.opal.gradientchooser.tests/target/surefire-reports/TEST-org.eclipse.nebula.widgets.opal.gradientchooser.GradientChooserDisplayScreenTest.xml",
                "org.eclipse.nebula.widgets.opal.gradientchooser.GradientChooserDisplayScreenTest",
                "realDisplayShowsBothColorPlanesAfterStopReplacement",
            ),
            (
                "widgets/visualization/org.eclipse.nebula.visualization.widgets.tests/target/surefire-reports/TEST-org.eclipse.nebula.visualization.widgets.HeatMapDisplayScreenTest.xml",
                "org.eclipse.nebula.visualization.widgets.HeatMapDisplayScreenTest",
                "realDisplayShowsChangedAndUnchangedCellPlanes",
            ),
        )
        
        def verify(root):
            for relative, classname, method in CASES:
                path = root / relative
                if not path.is_file():
                    raise AssertionError("Required native SCREEN JUnit XML missing: " + relative)
                if path.stat().st_size > 8 * 1024 * 1024:
                    raise AssertionError("Oversized native SCREEN JUnit XML: " + relative)
                data = path.read_bytes()
                if b"<!DOCTYPE" in data or b"<!ENTITY" in data:
                    raise AssertionError("Untrusted XML declaration in native SCREEN report: " + relative)
                suite = ET.fromstring(data)
                if suite.tag != "testsuite":
                    raise AssertionError("Expected a single original JUnit testsuite: " + relative)
                cases = list(suite.iter("testcase"))
                if len(cases) != 1 or any(suite.get(attr) != value for attr, value in (
                    ("tests", "1"), ("errors", "0"), ("failures", "0"), ("skipped", "0"),
                )):
                    raise AssertionError("Inconsistent native SCREEN JUnit suite counters: " + relative)
                case = cases[0]
                if case.get("classname") != classname or case.get("name") != method:
                    raise AssertionError("Wrong native SCREEN JUnit method identity: " + relative)
                if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                    raise AssertionError("Native SCREEN JUnit failed, errored or skipped: " + relative)
                print("NATIVE_SCREEN_JUNIT_PASS: " + classname + "." + method)
            return 2
        
        assert verify(Path(".")) == 2
        M3_NATIVE_SCREEN_JUNIT
    - name: Qualify Grid native screen pixels with OpenCV
      if: ${{ !cancelled() }}
      run: |
        python3 -m venv /tmp/nebula-vision
        /tmp/nebula-vision/bin/pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
        /tmp/nebula-vision/bin/python releng/swt-receiver/verify_grid_screenshots.py \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports \
          releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
    - name: Upload Grid visible-range screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grid-visible-range-screenshots
        if-no-files-found: warn
        path: |
          releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
          releng/swt-receiver/swt-receiver-p2/target/repository/*.xml
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-native-oracle-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports/
    - name: Upload original native widget pixel mismatch PNGs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-native-pixel-diagnostics
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/nebula-widget-pixels/*.png
          /tmp/m3-widget-pixels/*.png
    # Diagnostic only; original Maven still owns the release verdict.
    - name: Classify exact native Surefire failures and skips
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP:?}/nebula-native-census"
        mkdir -p "$work/classes" "$work/reports"
        javac --release 21 -Xlint:all -Werror -d "$work/classes" \
          releng/native-census/NativeSurefireCensus.java \
          releng/native-census/NativeSurefireCensusProof.java
        java -cp "$work/classes" NativeSurefireCensusProof
        java -cp "$work/classes" NativeSurefireCensus . "$work/reports"
    - name: Upload native Surefire failure census
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-native-junit-census
        if-no-files-found: warn
        path: ${{ runner.temp }}/nebula-native-census/reports/*.tsv
    - name: Upload all widget test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-widget-test-reports
        if-no-files-found: error
        path: '**/target/surefire-reports/TEST-*.xml'
