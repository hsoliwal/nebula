name: Java CI with Maven

on:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      SWT_GTK4: "0"
      GDK_BACKEND: x11
    strategy:
      matrix:
        java: [ '21' ]
    name: Java ${{ matrix.java }} compile
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Set up Maven
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
      with:
        maven-version: 3.9.6
    - name: Build All Widgets
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1.0.1
      with:
       run: mvn -V -B clean verify -Dtycho.localArtifacts=ignore -Dnebula.grid.viewport.screenshots.screen=true
    - name: Qualify Grid native screen pixels with OpenCV
      run: |
        python3 -m venv /tmp/nebula-vision
        /tmp/nebula-vision/bin/pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
        /tmp/nebula-vision/bin/python m3/convergence/verify_grid_screenshots.py \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports
    - name: Upload Grid visible-range screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grid-visible-range-screenshots
        if-no-files-found: warn
        path: |
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports/
