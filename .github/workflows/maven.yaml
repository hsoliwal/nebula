name: Java CI with Maven

on:
  workflow_call:
    inputs:
      release_verification:
        description: Execute all active widget test modules with failures fatal
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-24.04
    env:
      SWT_GTK4: "0"
      GDK_BACKEND: x11
      M3_MAVEN_TRANSIENT_RETRY_DELAY_SECONDS: "30"
    strategy:
      matrix:
        java: [ '21' ]
    name: Java ${{ matrix.java }} compile
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Verify preinstalled Maven (avoid rate-limited Maven Central archive)
      shell: bash
      run: |
        set -euo pipefail
        mvn -version | tee "$RUNNER_TEMP/nebula-maven-version.txt"
        grep -Eq '^Apache Maven 3[.](9|10)[.]' "$RUNNER_TEMP/nebula-maven-version.txt"
    - name: Checkout the qualified SWT receiver
      uses: actions/checkout@v4
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: 25e637e40c5243f5210586007a74206d8dce7953
        path: .m3-swt
        fetch-depth: 0
        lfs: false
    # Parent source is a separate original Eclipse EDL-1.0 project, not Synexia code.
    # The SWT POM requests ../eclipse-platform-parent; keep the exact source identity.
    - name: Checkout exact Eclipse 4.42 parent source
      uses: actions/checkout@v4
      with:
        repository: eclipse-platform/eclipse.platform.releng.aggregator
        ref: 8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec
        path: .m3-eclipse-releng
        sparse-checkout: eclipse-platform-parent
        sparse-checkout-cone-mode: true
        fetch-depth: 1
        persist-credentials: false
        lfs: false
    - name: Bind pinned upstream Eclipse parent without changing SWT source
      shell: bash
      run: |
        set -euo pipefail
        src=.m3-eclipse-releng/eclipse-platform-parent/pom.xml
        test "$(git -C .m3-eclipse-releng rev-parse HEAD)" = "8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec"
        test "$(git hash-object "$src")" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
        printf '%s  %s\n' "121b6c26d986874391d26d114377e3beda91723b0d675146bdd194dbfe01e264" "$src" | sha256sum --check
        test "$(git -C .m3-swt rev-parse HEAD)" = "25e637e40c5243f5210586007a74206d8dce7953"
        test "$(git hash-object .m3-swt/pom.xml)" = "f0e7537f58999feb562d17602f2f75dd1db3e80f"
        test ! -e eclipse-platform-parent
        mkdir -p eclipse-platform-parent
        cp "$src" eclipse-platform-parent/pom.xml
        test "$(git hash-object eclipse-platform-parent/pom.xml)" = "c0b221e4b62f119e8a28fc61e9a44c568933dfa0"
        python3 - <<'PY'
        from pathlib import Path
        from xml.etree import ElementTree as ET
        ns = "{http://maven.apache.org/POM/4.0.0}"
        parent = ET.parse("eclipse-platform-parent/pom.xml").getroot()
        swt = ET.parse(".m3-swt/pom.xml").getroot()
        def value(element, path):
            node = element.find(path)
            return node.text.strip() if node is not None and node.text else None
        assert (value(parent, ns+"groupId"), value(parent, ns+"artifactId"),
                value(parent, ns+"version"), value(parent, ns+"packaging")) == (
                    "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT", "pom")
        expected = swt.find(ns+"parent")
        assert expected is not None
        assert (value(expected, ns+"groupId"), value(expected, ns+"artifactId"),
                value(expected, ns+"version"), value(expected, ns+"relativePath")) == (
                    "org.eclipse", "eclipse-platform-parent", "4.42.0-SNAPSHOT",
                    "../eclipse-platform-parent")
        assert "Eclipse Distribution License v1.0" in Path("eclipse-platform-parent/pom.xml").read_text()
        print("SWT_LOCAL_PARENT_SOURCE_IDENTITY=PASS")
        PY
    - name: Qualify fail-closed HTTP 429/503 retry behavior
      run: bash releng/swt-receiver/test-retry-transient-maven-503.sh
    - name: Build and bind the pinned SWT GTK3 distribution
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev
        GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
          bash releng/swt-receiver/retry-transient-maven-503.sh \
          mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
          -Dtycho.baseline.replace=none -pl :org.eclipse.swt.gtk.linux.x86_64 -am package
        python3 releng/swt-receiver/prepare_swt_receiver.py .m3-swt releng/swt-receiver/swt-receiver-p2/target/binding \
          releng/swt-receiver/swt-receiver-p2/target/repository
        bash releng/swt-receiver/retry-transient-maven-503.sh mvn -B -f releng/swt-receiver/swt-receiver-p2/pom.xml \
          -Dm3.swt.source="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
        cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"
    - name: Run the excluded DrawnBrowser reactor under pinned GTK3/X11
      shell: bash
      run: |
        set -euo pipefail
        # The root Nebula <modules> list omits widgets/drawnbrowser.
        # Qualify the original HTML renderer explicitly with its real native SWT dependencies.
        sudo apt-get install -y xvfb x11-xserver-utils openbox wmctrl
        xvfb-run --auto-servernum bash -c '
          set -euo pipefail
          openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/drawnbrowser-openbox.log" 2>&1 &
          wm_pid=$!
          trap "kill $wm_pid 2>/dev/null || true" EXIT
          for attempt in $(seq 1 100); do
            if wmctrl -m >/dev/null 2>&1; then break; fi
            kill -0 "$wm_pid" 2>/dev/null || exit 1
            sleep 0.1
          done
          wmctrl -m
          "$@"
        ' drawnbrowser-wm bash releng/swt-receiver/retry-transient-maven-503.sh mvn -V -B --fail-at-end -f widgets/drawnbrowser/pom.xml clean verify \
          -Dtycho.localArtifacts=ignore \
          -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false \
          -Dtests.vmargs=-Xcheck:jni \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing pinned GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing platform}"
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET
        reports = sorted(glob.glob('widgets/drawnbrowser/**/target/surefire-reports/TEST-*.xml', recursive=True))
        if not reports:
            sys.exit('FAIL: absent DrawnBrowser JUnit reports')
        tests = failed = skipped = 0
        for f in reports:
            root = ET.parse(f).getroot()
            suites = [root] if root.tag.endswith('testsuite') else list(root)
            for suite in suites:
                if suite.tag.endswith('testsuite'):
                    tests += int(suite.get('tests', '0'))
                    failed += int(suite.get('failures', '0')) + int(suite.get('errors', '0'))
                    skipped += int(suite.get('skipped', '0'))
        required = {
            'DrawnBrowserFormPositionTest',
            'DrawnBrowserStackingCompositionTest',
            'HtmlControlLayoutTest',
            'HtmlControlStylesTest',
            'HtmlStackingCompositionTest',
        }
        required_scroll_methods = {
            'hiddenPanelCanProgrammaticallyScrollWithoutGrowingOuterDocument',
            'panelsCanScrollTheirOwnTextWithoutMovingTheirBorder',
            'clipPanelRejectsProgrammaticScrollAndHasNoScrollLimit',
            'panelOffsetIsClampedPreservedOnRelayoutAndReturnedToZero',
            'fixedDescendantDoesNotMoveWithAnUnrelatedHiddenPanelScroll',
        }
        required_methods = {
            ('HtmlStylesTest', 'overflowScrollModesDoNotAliasTheMaskOrInherit'),
            ('HtmlPositionedGeometryTest', 'hiddenProgrammaticScrollPreservesTheParentBorderButClipRefusesScroll'),
            ('HtmlPositionedGeometryTest', 'autoAndScrollPanelsConsumeWheelWithoutMovingRoot'),
            ('HtmlPositionedGeometryTest', 'nestedPanelScrollOffsetsAddAndFixedChildrenEscapeThem'),
            ('DrawnBrowserPositionedTest', 'nestedWheelScrollMovesPanelPixelsWithoutMovingTheRootPage'),
        }
        seen = set()
        seen_scroll_methods = set()
        methods = set()
        for f in reports:
            doc = ET.parse(f).getroot()
            for case in doc.iter('testcase'):
                cls = case.attrib.get('classname', '').rsplit('.', 1)[-1]
                seen.add(cls)
                methods.add((cls, case.attrib.get('name', '')))
                if cls == 'HtmlPositionedGeometryTest':
                    seen_scroll_methods.add(case.attrib.get('name', ''))
        missing = sorted(required - seen)
        missing_scroll = sorted(required_scroll_methods - seen_scroll_methods)
        missing_methods = sorted(required_methods - methods)
        print(f'DrawnBrowser tests={tests} failures+errors={failed} skipped={skipped} '
              f'missing_classes={missing} missing_scroll_methods={missing_methods} '
              f'missing_hidden_panel_methods={missing_scroll}')
        if tests < 399 or failed or skipped or missing or missing_methods or missing_scroll:
            sys.exit('FAIL: expected >=399 GTK3 native tests, five stacking classes, '
                     'five original scrolling methods, five hidden-panel scroll methods, zero failed/skipped')
        PY
    - name: Build All Widgets
      shell: bash
      env:
        M3_RELEASE_VERIFICATION: ${{ inputs.release_verification }}
      run: |
        set -euo pipefail
        release_flags=()
        if [[ "${M3_RELEASE_VERIFICATION:-}" == "true" ]]; then
          release_flags=(-DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false)
        fi
        sudo apt-get install -y xvfb x11-xserver-utils openbox wmctrl
        # A real X11 window manager must deliver native Iconify/Deiconify; xvfb alone
        # supplies a display but does not provide window-management transitions.
        xvfb-run --auto-servernum bash -c '
          set -euo pipefail
          openbox --sm-disable >"${RUNNER_TEMP:-/tmp}/nebula-openbox.log" 2>&1 &
          wm_pid=$!
          trap "kill $wm_pid 2>/dev/null || true" EXIT
          for attempt in $(seq 1 100); do
            if wmctrl -m >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              echo "openbox exited before becoming the X11 window manager" >&2
              exit 1
            fi
            sleep 0.1
          done
          if ! wmctrl -m; then
            echo "no native window manager registered on $DISPLAY" >&2
            exit 1
          fi
          "$@"
        ' nebula-wm bash releng/swt-receiver/retry-transient-maven-503.sh mvn -V -B --fail-at-end clean verify "${release_flags[@]}" \
          -Dtycho.localArtifacts=ignore \
          -Dnebula.grid.viewport.screenshots.screen=true \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing SWT GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing SWT platform}"
    - name: Qualify Grid native screen pixels with OpenCV
      run: |
        python3 -m venv /tmp/nebula-vision
        /tmp/nebula-vision/bin/pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
        /tmp/nebula-vision/bin/python releng/swt-receiver/verify_grid_screenshots.py \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots \
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports \
          releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
    - name: Upload Grid visible-range screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grid-visible-range-screenshots
        if-no-files-found: warn
        path: |
          releng/swt-receiver/swt-receiver-p2/target/binding/expected.json
          releng/swt-receiver/swt-receiver-p2/target/repository/*.xml
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-visible-range-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/m3-native-oracle-screenshots/
          widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports/
    - name: Upload all widget test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nebula-widget-test-reports
        if-no-files-found: error
        path: '**/target/surefire-reports/TEST-*.xml'
