# SPDX-License-Identifier: Apache-2.0
name: M3 web-to-SWT inventory
on:
  pull_request:
    paths:
      - 'm3/web-widget-reverse/**'
      - 'docs/m3/rwt/RWT_COLUMN.tsv'
      - 'docs/m3/custom-widgets/WIDGET_MATRIX.tsv'
      - '.github/workflows/m3-web-swt-map-audit-20261025.yml'
  workflow_dispatch:
jobs:
  inventory-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refusal unit tests
        run: python3 m3/web-widget-reverse/tools/verify_web_swt.py --self-test
      - name: Current Nebula and RAP concept crosswalk
        run: python3 m3/web-widget-reverse/tools/verify_web_swt.py
  swt-linux-native:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0
      - name: Compile and test original native SWT owner
        run: xvfb-run -a mvn -B -ntp -f m3/web-widget-reverse/examples/native-form/pom.xml test
  rwt-api-compile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile identical Java with RAP RWT (no browser session)
        run: mvn -B -ntp -f m3/web-widget-reverse/examples/native-form/pom.xml -Prwt -Dmaven.test.skip=true package
