name: M3 Nebula Grid primitive viewport API receiving
on:
  pull_request:
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/Grid.java'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/GridViewportItemRange_Test.java'
      - 'docs/m3/grid-viewport/GRID_VIEWPORT_ITEM_RANGE_API_RECEIVER.md'
      - '.github/workflows/m3-grid-viewport-item-window-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-admission:
    if: github.repository == 'hsoliwal/nebula'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
      - name: Enforce canonical recipe receiving before runtime verification
        shell: bash
        run: |
          set -euo pipefail
          GRID='widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/Grid.java'
          TEST='widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/GridViewportItemRange_Test.java'
          test -s "$GRID"
          test -s "$TEST"
          count="$(grep -c 'public void getViewportItemRange(' "$GRID" || true)"
          if [ "$count" != 1 ]; then
            echo "::error title=M3 Grid API not received::Expected one method generated by canonical Synexia OpenRewrite; found $count. Do not edit Grid.java manually."
            exit 1
          fi
          grep -F 'checkWidget();' "$GRID" >/dev/null
          echo 'M3_GRID_API_RECEIVER_SOURCE_READY=1'
  gtk-ui-contract:
    needs: source-admission
    if: github.repository == 'hsoliwal/nebula'
    strategy:
      fail-fast: false
      matrix:
        mode: [viewport, original]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
      JAVA_TOOL_OPTIONS: -Dswt.widget.mode.Grid=${{ matrix.mode }}
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install GTK3/Xvfb native test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb dbus-x11 libgtk-3-0
      - name: Run original and viewport Tycho contracts in independent JVMs
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1200x800x24 -noreset' \
            mvn -B -ntp -f widgets/grid/pom.xml -Pfull-grid-contracts \
              -pl org.eclipse.nebula.widgets.grid.test -am \
              -DfailIfNoTests=true verify
      - name: Reject absent, failed or skipped new API tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches=list(Path('widgets/grid/org.eclipse.nebula.widgets.grid.test/target').rglob('*GridViewportItemRange_Test*.xml'))
          assert matches, 'no executed GridViewportItemRange_Test report'
          count=0
          for p in matches:
              r=ET.parse(p).getroot()
              assert all(int(r.attrib.get(k,'0')) == 0 for k in ('failures','errors','skipped')), p
              count+=int(r.attrib.get('tests','0'))
          assert count >= 4, f'expected at least 4 executed API cases, got {count}'
          print('M3_GRID_API_NATIVE_MODE_PROOF=PASSED', count)
          PY
      - name: Archive native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-grid-item-window-api-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            widgets/grid/org.eclipse.nebula.widgets.grid.test/target/**/*surefire*.xml
            widgets/grid/org.eclipse.nebula.widgets.grid.test/target/surefire-reports/*.xml
            widgets/grid/org.eclipse.nebula.widgets.grid.test/target/**/*.log
