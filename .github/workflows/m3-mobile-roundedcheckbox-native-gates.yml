name: Nebula mobile original-widget Android+iOS qualification
on:
  pull_request:
    paths:
      - 'widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/**'
      - '.github/workflows/m3-mobile-roundedcheckbox-native-gates.yml'
  push:
    paths:
      - 'widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/**'
      - '.github/workflows/m3-mobile-roundedcheckbox-native-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-native-original-widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 90515aac964c00ec23bb3c34832a92b217ff81b3
          path: swt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Install actual Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile SWT Android Java/JNI owner closure
        run: mvn -B -ntp -f swt/mobile/pom.xml -Dmobile.platform=android "-Dandroid.sdk=$ANDROID_SDK_ROOT" clean verify
      - name: Assemble original Nebula widget Android app and test APKs
        run: gradle --no-daemon -p widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android "-PswtMobileJar=$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-android.jar" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Launch API 35 emulator and run native screen/touch/Scale selection tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon -p widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android "-PswtMobileJar=$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-android.jar" :app:connectedDebugAndroidTest
      - name: Upload Android native-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-mobile-android-original-widgets-reports
          path: |
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android/app/build/reports/androidTests/**
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
  ios-java-and-uikit-source-gate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 90515aac964c00ec23bb3c34832a92b217ff81b3
          path: swt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile SWT iOS owner JAR
        run: mvn -B -ntp -f swt/mobile/pom.xml -Dmobile.platform=ios clean verify
      - name: Compile real Nebula mobile original widget and entrypoints
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nebula-mobile-ios-classes"
          mkdir -p "$OUT"
          javac --release 21 -cp "$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-ios.jar" -d "$OUT" \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox/src/org/eclipse/nebula/widgets/roundedcheckbox/RoundedCheckbox.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/SelectionListenerUtil.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/ReflectionUtils.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileContents.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileMain.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/ios/src/main/java/org/eclipse/nebula/examples/mobile/IOSNebulaDemo.java
      - name: Compile real UIKit JNI bridge against simulator SDK
        run: bash swt/mobile/ios/build.sh iphonesimulator arm64 "$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-ios.jar"
