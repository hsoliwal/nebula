# SPDX-License-Identifier: Apache-2.0
name: Nebula PShelf original parent viewport item count
on:
  pull_request:
    paths:
      - 'widgets/pshelf/org.eclipse.nebula.widgets.pshelf/src/org/eclipse/nebula/widgets/pshelf/PShelf.java'
      - 'widgets/pshelf/org.eclipse.nebula.widgets.pshelf/src/org/eclipse/nebula/widgets/pshelf/PShelfItem.java'
      - 'widgets/pshelf/org.eclipse.nebula.widgets.pshelf/tests/org/eclipse/nebula/widgets/pshelf/PShelfItemCountContractTest.java'
      - 'widgets/pshelf/org.eclipse.nebula.widgets.pshelf/run-item-owner-proof.sh'
      - '.github/workflows/m3-pshelf-item-private-count.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner-contract-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate original virtual getter and exact class private fast path
        run: bash widgets/pshelf/org.eclipse.nebula.widgets.pshelf/run-item-owner-proof.sh
