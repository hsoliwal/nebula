name: Nebula Grid cell selection hash real-source Java21

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridCellSelectionList.java'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/GridCellSelectionList_Test.java'
      - 'tools/headless-grid-selection/**'
      - '.github/workflows/m3-grid-cell-selection-hash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual GridCellSelectionList and run deterministic contract
        run: bash tools/headless-grid-selection/verify.sh
      - name: Preserve source identity and result logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m3-grid-cell-hash-source-${{ github.sha }}
          path: target/m3-grid-cell-selection-hash/
          if-no-files-found: warn
          retention-days: 60
