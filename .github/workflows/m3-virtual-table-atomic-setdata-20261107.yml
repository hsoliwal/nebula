# SPDX-License-Identifier: Apache-2.0
name: M3 original SWT virtual Table full SetData atomicity
on:
  pull_request:
    paths:
      - 'widgets/m3/org.eclipse.nebula.widgets.m3/src/org/eclipse/nebula/widgets/m3/M3VirtualTableBinding.java'
      - 'widgets/m3/org.eclipse.nebula.widgets.m3.tests/src/org/eclipse/nebula/widgets/m3/tests/M3VirtualTableBindingTest.java'
      - 'm3/web-widget-reverse/qualification/virtual-table-atomic/**'
      - 'docs/m3/web-interoperability/VIRTUAL_TABLE_BINDING.md'
      - '.github/workflows/m3-virtual-table-atomic-setdata-20261107.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-exact-product-setdata:
    name: Original Table JavaSE-11 with test-only nested SetData event shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute exact product Java callback and mutation refusal
        shell: bash
        run: |
          set -euo pipefail
          bash m3/web-widget-reverse/qualification/virtual-table-atomic/run.sh
      - name: Explicit source-only qualification boundary
        run: echo 'This SWT event-shape smoke is NOT a native GUI or RAP transport proof.'

  rwt-48-original-table-api:
    name: Compile exact original Table binding against pinned real RWT 4.8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original upstream RWT artifact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 60 -o rwt-4.8.0.jar \
            https://repo.maven.apache.org/maven2/org/eclipse/rap/org.eclipse.rap.rwt/4.8.0/org.eclipse.rap.rwt-4.8.0.jar
          echo 'b61f95c6f93ee8c507934bfa7c2001936da2e24f645b041e04ba83587e22647c  rwt-4.8.0.jar' | sha256sum -c -
      - name: Compile original product code with JavaSE-11 source/binary floor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p classes
          javac --release 11 -proc:none -Xlint:all -Werror -encoding UTF-8 \
            -cp rwt-4.8.0.jar -d classes \
            widgets/m3/org.eclipse.nebula.widgets.m3/src/org/eclipse/nebula/widgets/m3/M3VirtualTableBinding.java
      - name: Keep browser and API qualification separate
        run: echo 'RWT Java API compilation is not live RAP server, browser, or native SWT acceptance.'

  native-swt-gtk-existing-tests:
    name: Original SWT GTK/Xvfb virtual Table JUnit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: GTK native display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Execute actual SWT M3 Tycho test bundle under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a mvn -B -ntp -f widgets/m3/pom.xml \
            -pl :org.eclipse.nebula.widgets.m3.tests -am verify
      - name: Require original native virtual Table JUnit to execute and pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_JUNIT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('widgets/m3/org.eclipse.nebula.widgets.m3.tests/target/surefire-reports')
          required = {
              'millionLogicalRowsUseOriginalSwtVirtualItemProtocolAndBoundedPages',
              'selectionFromSwtEventRetainsKeysAndUnqualifiedStyleFailsClosed',
          }
          results = []
          if not reports.is_dir():
              raise SystemExit('BLOCK: no original SWT JUnit report folder')
          for report in reports.glob('TEST-*.xml'):
              for case in ET.parse(report).getroot().findall('.//testcase'):
                  if case.get('classname', '').endswith('M3VirtualTableBindingTest'):
                      results.append(case)
          found = {case.get('name', '') for case in results}
          if len(results) != len(required) or found != required:
              raise SystemExit(f'BLOCK: original Table tests missing/duplicate: {sorted(found)}')
          for case in results:
              if any(case.find(tag) is not None for tag in ('skipped','error','failure')):
                  raise SystemExit('BLOCK: original SWT Table test failed/skipped: ' + case.get('name',''))
          print('PASS original SWT GTK/Xvfb virtual Table JUnit:', sorted(found))
          PY_JUNIT
      - name: Retain the native original SWT JUnit test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-swt-virtual-table-atomic-junit
          path: widgets/m3/org.eclipse.nebula.widgets.m3.tests/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
      - name: Explicit remaining platform boundary
        run: echo 'GTK SWT JUnit does not qualify RAP browser sessions, Win32/Cocoa, accessibility or pixels.'
