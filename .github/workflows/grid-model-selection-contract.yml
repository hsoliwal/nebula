# SPDX-License-Identifier: Apache-2.0 OR EPL-2.0
name: Nebula Grid packed model selection contracts
on:
  pull_request:
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/model/**'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridModelJobs.java'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/GridModelJobs_Test.java'
      - 'releng/verification/grid-cpu-sort/**'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/model/**'
      - '.github/workflows/grid-model-selection-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jdk-model-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original model owners with javac (no SWT or Xvfb)
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          src=widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/model
          test=widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/model
          javac --release 21 -d "$output" \
            "$src/HeapSampler.java" \
            "$src/HeapGrowth.java" \
            "$src/RowComparator.java" \
            "$src/RowPredicate.java" \
            "$src/RowView.java" \
            "$src/IntPermutationSort.java" \
            "$src/RowPermutation.java" \
            "$src/RowSparseBits.java" \
            "$src/RowSelection.java" \
            "$test/RowSelectionMaskedCountContract.java"
          java -cp "$output" org.eclipse.nebula.widgets.grid.model.RowSelectionMaskedCountContract
      - name: Verify real RowPermutation and GridModelJobs CPU/UI contracts
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          src=widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid
          model="$src/model"
          stub=releng/verification/grid-cpu-sort/stubs
          javac --release 21 -Xlint:all -Werror -d "$output" \
            "$model/RowView.java" \
            "$model/RowComparator.java" \
            "$model/RowPredicate.java" \
            "$model/IntPermutationSort.java" \
            "$model/RowPermutation.java" \
            "$stub/org/eclipse/swt/SWT.java" \
            "$stub/org/eclipse/swt/SWTException.java" \
            "$stub/org/eclipse/swt/widgets/Event.java" \
            "$stub/org/eclipse/swt/widgets/Listener.java" \
            "$stub/org/eclipse/swt/widgets/Display.java" \
            "$stub/org/eclipse/swt/custom/BusyIndicator.java" \
            "$stub/org/eclipse/nebula/widgets/grid/Grid.java" \
            "$src/GridModelJobs.java" \
            releng/verification/grid-cpu-sort/RowPermutationCpuCancellationContract.java \
            releng/verification/grid-cpu-sort/HeadlessGridCpuUiContract.java
          java -ea -cp "$output" org.eclipse.nebula.widgets.grid.model.RowPermutationCpuCancellationContract
          java -ea -cp "$output" org.eclipse.nebula.widgets.grid.HeadlessGridCpuUiContract
