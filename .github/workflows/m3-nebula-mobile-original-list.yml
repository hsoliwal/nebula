name: Nebula SWT mobile original List Text Combo Android/iOS acceptance
on:
  workflow_call:
  pull_request:
    paths:
      - 'widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/**'
      - '.github/workflows/m3-nebula-mobile-original-list.yml'
  push:
    paths:
      - 'widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/**'
      - '.github/workflows/m3-nebula-mobile-original-list.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-original-widget-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 19932a279ad8730b1310d382def90b16dc82daf0
          path: swt-mobile
          persist-credentials: false
      - name: Record exact receiving source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-acceptance-evidence
          test "$(git -C swt-mobile rev-parse HEAD)" = "19932a279ad8730b1310d382def90b16dc82daf0"
          git rev-parse HEAD > mobile-acceptance-evidence/nebula-source.txt
          git -C swt-mobile rev-parse HEAD > mobile-acceptance-evidence/swt-source.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Install actual Android API 35 and platform tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile canonical SWT Android mobile List, Text, Combo and JNI owners
        run: mvn -B -ntp -f swt-mobile/mobile/pom.xml -Dmobile.platform=android "-Dandroid.sdk=$ANDROID_SDK_ROOT" clean verify
      - name: Assemble Nebula original-widget app and native instrumentation
        run: gradle --no-daemon -p widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android "-PswtMobileJar=$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-android.jar" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare native test runner and screenshot capture
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nebula-native-acceptance.sh" <<'SCRIPT'
          set -euo pipefail
          mkdir -p mobile-acceptance-evidence/screenshots
          capture_native_evidence() {
            local test_status=$?
            local capture_status=0
            trap - EXIT
            set +e
            for name in before recovery after; do
              adb pull "/sdcard/Android/data/org.eclipse.nebula.examples.mobile/files/nebula-android-$name.png" \
                "mobile-acceptance-evidence/screenshots/nebula-android-$name.png" || capture_status=1
            done
            if [[ "$test_status" -ne 0 ]]; then
              exit "$test_status"
            fi
            exit "$capture_status"
          }
          trap capture_native_evidence EXIT
          sha256sum swt-mobile/mobile/target/swt-mobile-android.jar > mobile-acceptance-evidence/swt-jar.sha256
          gradle --no-daemon -p widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android "-PswtMobileJar=$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-android.jar" -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest \
            2>&1 | tee mobile-acceptance-evidence/android-native-execution.log
          SCRIPT
      - name: Execute original Combo popup, List, Text IME and native widget tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: bash "$RUNNER_TEMP/nebula-native-acceptance.sh"
      - name: Retain Android native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-original-list-device-reports
          path: |
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android/app/build/reports/androidTests/**
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/android/app/build/outputs/androidTest-results/**
            mobile-acceptance-evidence/**
          if-no-files-found: warn
  ios-original-list-source:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 19932a279ad8730b1310d382def90b16dc82daf0
          path: swt-mobile
          persist-credentials: false
      - name: Record exact receiving source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-acceptance-evidence
          test "$(git -C swt-mobile rev-parse HEAD)" = "19932a279ad8730b1310d382def90b16dc82daf0"
          git rev-parse HEAD > mobile-acceptance-evidence/nebula-source.txt
          git -C swt-mobile rev-parse HEAD > mobile-acceptance-evidence/swt-source.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile SWT mobile iOS Java owners, List, Text and Combo
        run: mvn -B -ntp -f swt-mobile/mobile/pom.xml -Dmobile.platform=ios clean verify
      - name: Compile original Nebula widget Java source against iOS SWT JAR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nebula-mobile-ios"
          javac --release 21 -cp "$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-ios.jar" \
            -d "$RUNNER_TEMP/nebula-mobile-ios" \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox/src/org/eclipse/nebula/widgets/roundedcheckbox/RoundedCheckbox.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/SelectionListenerUtil.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/ReflectionUtils.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileContents.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileMain.java \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox.mobile/ios/src/main/java/org/eclipse/nebula/examples/mobile/IOSNebulaDemo.java
      - name: Compile UIKit bridge and execute current native renderer contracts
        run: bash swt-mobile/mobile/ios/build.sh iphonesimulator arm64 "$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-ios.jar"
      - name: Retain iOS native kernel results and source revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-pinned-swt-ios-native-kernel-reports
          path: |
            mobile-acceptance-evidence/**
            swt-mobile/build/ios-iphonesimulator-arm64/native-render-tests.log
          if-no-files-found: warn
