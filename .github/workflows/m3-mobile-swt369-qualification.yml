name: Nebula SWT mobile source/Android/iOS compile qualification
on:
  pull_request:
    paths:
      - 'm3/mobile/**'
      - '.github/workflows/m3-mobile-swt369-qualification.yml'
  push:
    paths:
      - 'm3/mobile/**'
      - '.github/workflows/m3-mobile-swt369-qualification.yml'
permissions:
  contents: read
jobs:
  android-mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: de7171a6ac8f584379b5d2564f6984d9a48aca85
          path: swt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Install real Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build canonical SWT Android Java owners/JAR
        run: mvn -B -ntp -f swt/mobile/pom.xml -Dmobile.platform=android "-Dandroid.sdk=$ANDROID_SDK_ROOT" clean verify
      - name: Build Nebula original RoundedCheckbox Android and instrumentation APKs
        run: gradle --no-daemon -p m3/mobile/android "-PswtMobileJar=$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-android.jar" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Store compiled APKs (not native execution evidence)
        uses: actions/upload-artifact@v4
        with:
          name: nebula-swt-mobile-android-unqualified-apks
          path: m3/mobile/android/app/build/outputs/apk/**/*
          if-no-files-found: error
  ios-java-and-uikit-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: de7171a6ac8f584379b5d2564f6984d9a48aca85
          path: swt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile canonical SWT iOS Java/JNI owner artifact
        run: mvn -B -ntp -f swt/mobile/pom.xml -Dmobile.platform=ios clean verify
      - name: Compile unchanged Nebula widget and shared Android/iOS main
        run: |
          mkdir -p "$RUNNER_TEMP/nebula-ios-classes"
          javac --release 21 -cp "$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-ios.jar" \
            -d "$RUNNER_TEMP/nebula-ios-classes" \
            widgets/roundedcheckbox/org.eclipse.nebula.widgets.roundedcheckbox/src/org/eclipse/nebula/widgets/roundedcheckbox/RoundedCheckbox.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/SelectionListenerUtil.java \
            widgets/opal/commons/org.eclipse.nebula.widgets.opal.commons/src/org/eclipse/nebula/widgets/opal/commons/ReflectionUtils.java \
            m3/mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileContents.java \
            m3/mobile/common/src/main/java/org/eclipse/nebula/examples/mobile/NebulaMobileMain.java \
            m3/mobile/ios/src/main/java/org/eclipse/nebula/examples/mobile/IOSNebulaDemo.java
      - name: Compile real UIKit bridge (not runtime/device qualification)
        run: bash swt/mobile/ios/build.sh iphonesimulator arm64 "$GITHUB_WORKSPACE/swt/mobile/target/swt-mobile-ios.jar"
