name: M3 Grid baseline verification

on:
  push:
    branches: [ m3/nebula-grid-baseline-verify-20261004 ]

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.6
      - name: Compile and test untouched Grid closure
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
        with:
          run: mvn -V -B -f widgets/grid/pom.xml -pl org.eclipse.nebula.widgets.grid.test -am verify -Dtycho.localArtifacts=ignore
