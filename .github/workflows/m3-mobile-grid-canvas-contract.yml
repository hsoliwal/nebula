name: Nebula Grid mobile Canvas receiver SWT contract
on:
  pull_request:
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/internal/mobile/**'
      - 'm3/mobile/grid-tests/**'
      - '.github/workflows/m3-mobile-grid-canvas-contract.yml'
  push:
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/internal/mobile/**'
      - 'm3/mobile/grid-tests/**'
      - '.github/workflows/m3-mobile-grid-canvas-contract.yml'
permissions:
  contents: read
jobs:
  headless-swt-owner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: de7171a6ac8f584379b5d2564f6984d9a48aca85
          path: swt-mobile
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build SWT mobile shared source and runtime JAR
        run: mvn -B -ntp -f swt-mobile/mobile/pom.xml clean verify
      - name: Execute SWT Canvas/Grid mobile receiver contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-grid-contract"
          javac --release 21 -Xlint:all \
            -cp "$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-shared.jar" \
            -d "$RUNNER_TEMP/mobile-grid-contract" \
            "swt-mobile/tests/org.eclipse.swt.tests.mobile/src/org/eclipse/swt/tests/mobile/ContractPlatform.java" \
            "widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/internal/mobile/MobileGridViewport.java" \
            "widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/internal/mobile/MobileGridCanvasReceiver.java" \
            "m3/mobile/grid-tests/org/eclipse/swt/tests/mobile/MobileGridCanvasReceiverTest.java"
          java -ea -cp "$RUNNER_TEMP/mobile-grid-contract:$GITHUB_WORKSPACE/swt-mobile/mobile/target/swt-mobile-shared.jar" \
            org.eclipse.swt.tests.mobile.MobileGridCanvasReceiverTest
