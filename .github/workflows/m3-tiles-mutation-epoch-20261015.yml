# SPDX-License-Identifier: Apache-2.0
name: Nebula Tiles original viewport mutation-epoch regression
on:
  pull_request:
    paths:
      - 'widgets/tiles/org.eclipse.nebula.widgets.tiles/src/org/eclipse/nebula/widgets/tiles/FrameStatic.java'
      - 'widgets/tiles/org.eclipse.nebula.widgets.tiles/tests/org/eclipse/nebula/widgets/tiles/TilesMutationEpochProof.java'
      - 'widgets/tiles/org.eclipse.nebula.widgets.tiles/run-mutation-epoch.sh'
      - '.github/workflows/m3-tiles-mutation-epoch-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-scan-vs-index-epoch-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original and indexed Java21 alias/callback contract regression
        run: bash widgets/tiles/org.eclipse.nebula.widgets.tiles/run-mutation-epoch.sh
