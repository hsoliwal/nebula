# SPDX-License-Identifier: Apache-2.0 OR EPL-2.0
name: Nebula CPU viewport sort (real-source headless)
on:
  pull_request:
    paths:
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/GridModelJobs.java'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/model/RowPermutation.java'
      - 'widgets/grid/org.eclipse.nebula.widgets.grid.test/src/org/eclipse/nebula/widgets/grid/GridModelJobs_Test.java'
      - 'releng/verification/grid-cpu-sort/**'
      - '.github/workflows/grid-cpu-ui-sort.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original CPU model and execute no-SWT verification
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          src=widgets/grid/org.eclipse.nebula.widgets.grid/src/org/eclipse/nebula/widgets/grid/model
          javac --release 21 -Xlint:all -Werror -d "$output" \
            "$src/RowView.java" \
            "$src/RowComparator.java" \
            "$src/RowPredicate.java" \
            "$src/IntPermutationSort.java" \
            "$src/RowPermutation.java" \
            releng/verification/grid-cpu-sort/RowPermutationCpuCancellationContract.java
          java -ea -cp "$output" org.eclipse.nebula.widgets.grid.model.RowPermutationCpuCancellationContract
