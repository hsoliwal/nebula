name: Nebula M3 method-signal evidence

on:
  push:
    branches:
      - "m3/method-signal-evidence-20261004"
    paths:
      - "m3/recipe-first/**"
      - "m3/docs/method-signal-evidence.md"
      - "m3/README.md"
      - ".github/workflows/m3-method-signal-evidence.yml"
  pull_request:
    paths:
      - "m3/recipe-first/**"
      - "m3/docs/method-signal-evidence.md"
      - "m3/README.md"
      - ".github/workflows/m3-method-signal-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Maven 3.9.6
        uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f
        with:
          maven-version: 3.9.6

      - name: 1 diff hygiene and M3-only custody
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
          unexpected="$(git diff --name-only "$BASE_SHA...HEAD" | grep -Ev '^(m3/|\.github/workflows/m3-method-signal-evidence\.yml$)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Method-signal evidence escaped M3 control-plane scope:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: 2 compile M3 recipe-first reactor
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -pl recipe-first -am
          -DskipTests compile

      - name: 3 source-sealed recipe and method-evidence tests
        run: >
          mvn -B -ntp -f m3/recipe-first/pom.xml
          -Dtest=NebulaM3MethodSignalEvidenceRecipeTest,NebulaM3InventoryRecipeTest,NebulaM3RepositoryReviewRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 4 full recipe-first module verification
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -pl recipe-first -am verify

      - name: 5 whole-checkout file and method inventory
        run: >
          mvn -B -ntp -f m3/reactor.xml
          -Pinventory
          -Dm3.nebula.root="$GITHUB_WORKSPACE"
          -Dm3.nebula.out="$GITHUB_WORKSPACE/m3/recipe-first/target/nebula-m3-inventory"
          verify

      - name: 6 require complete deterministic method evidence
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY='m3/recipe-first/target/nebula-m3-inventory/nebula-m3-summary.tsv'
          METHODS='m3/recipe-first/target/nebula-m3-inventory/nebula-m3-java-methods.tsv'
          grep -F $'failureRows\t0' "$SUMMARY"
          method_rows="$(awk -F '\t' '$1 == "methodRows" {print $2}' "$SUMMARY")"
          test -n "$method_rows"
          test "$method_rows" -gt 0
          actual_rows="$(awk 'NR > 1 {n++} END {print n+0}' "$METHODS")"
          test "$actual_rows" -eq "$method_rows"
          printf 'Nebula method rows=%s\n' "$method_rows" >> "$GITHUB_STEP_SUMMARY"

      - name: 7 install local recipe artifact
        run: mvn -B -ntp -f m3/reactor.xml install

      - name: 8 execute read-only repository review with exported DataTables
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          mvn -B -ntp -Pm3-local-repository-review             -Drewrite.exportDatatables=true             rewrite:dryRunNoFork
          git diff --exit-code

      - name: 9 original Nebula Tycho reactor
        run: xvfb-run -a mvn -V -B -ntp clean verify -Dtycho.localArtifacts=ignore

      - name: 10 preserve method evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-m3-method-signal-evidence
          if-no-files-found: warn
          path: |
            m3/recipe-first/target/nebula-m3-inventory/
            **/target/rewrite/
            **/target/surefire-reports/
