name: Nebula PShelf intrinsic primitive viewport geometry
on:
  pull_request:
    paths:
      - 'widgets/pshelf/org.eclipse.nebula.widgets.pshelf/**'
      - '.github/workflows/m3-pshelf-intrinsic-viewport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real old-vs-new primitive viewport geometry oracle
        run: bash widgets/pshelf/org.eclipse.nebula.widgets.pshelf/run-geometry.sh
  jni-c17-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native C17 signed arithmetic and JNI Java21 parity
        run: bash widgets/pshelf/org.eclipse.nebula.widgets.pshelf/run-jni-parity.sh
  gtk-native-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch a pinned third-party SWT native GTK host dependency
        run: |
          mkdir -p .m3-pshelf/lib .m3-pshelf/classes
          curl --fail --location --retry 3 -o .m3-pshelf/lib/swt-core.jar \
            https://repo.maven.apache.org/maven2/org/eclipse/platform/org.eclipse.swt/3.126.0/org.eclipse.swt-3.126.0.jar
          curl --fail --location --retry 3 -o .m3-pshelf/lib/swt-gtk.jar \
            https://repo.maven.apache.org/maven2/org/eclipse/platform/org.eclipse.swt.gtk.linux.x86_64/3.126.0/org.eclipse.swt.gtk.linux.x86_64-3.126.0.jar
          unzip -t .m3-pshelf/lib/swt-core.jar >/dev/null
          unzip -t .m3-pshelf/lib/swt-gtk.jar >/dev/null
      - name: Compile original widget with original renderer and native smoke test
        run: |
          src=widgets/pshelf/org.eclipse.nebula.widgets.pshelf/src
          test=widgets/pshelf/org.eclipse.nebula.widgets.pshelf/tests
          javac --release 21 -cp ".m3-pshelf/lib/swt-core.jar:.m3-pshelf/lib/swt-gtk.jar" \
            -d .m3-pshelf/classes \
            "$src/org/eclipse/nebula/widgets/pshelf/"*.java \
            "$test/org/eclipse/nebula/widgets/pshelf/PShelfNativeSmoke.java"
      - name: Exercise the real GTK Canvas and dispose eight original PShelfItem peers
        run: |
          xvfb-run -a java -Xcheck:jni \
            -cp ".m3-pshelf/classes:.m3-pshelf/lib/swt-core.jar:.m3-pshelf/lib/swt-gtk.jar" \
            org.eclipse.nebula.widgets.pshelf.PShelfNativeSmoke
