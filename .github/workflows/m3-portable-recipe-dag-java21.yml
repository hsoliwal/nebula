            }
            if ($null -eq $expected) { $expected = $lines[1] }
            elseif ($expected -ne $lines[1]) {
              throw "Host-dependent recipe DAG or scheduler plan identity: $hostName"
            }
          }
          Write-Output 'Portable DAG and scheduler roots agree across three hosts.'
 -Quiet)) {
            throw 'Transfer contract must remain HOLD until product proof completes'
          }

          $receipt = "dagRoot`tplansRoot`ttransferRoot`n$dag`t$plans`t$transfer`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $out 'portable-roots.tsv'),
            $receipt,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: 4 - Export host-independent receipt
        uses: actions/upload-artifact@v4
