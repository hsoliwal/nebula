# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  schedule:
    - cron: '16 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # required for all workflows
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin']
        # CodeQL supports [ 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift' ]
        # Use only 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use only 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven
      uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
      with:
        maven-version: 3.9.11

    # CodeQL must trace the same source-pinned SWT JNI receiver that compiles
    # Nebula's inherited Canvas layer API. Upstream SWT lacks these methods.
    - name: Checkout source-pinned SWT GTK3 receiver
      uses: actions/checkout@v4
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: e352d87e5f2d7b98307f42102815409d851c1a23
        path: .m3-swt
        fetch-depth: 0
        lfs: false

    - name: Validate receiver 503 refusal and build exact SWT GTK3 natives
      shell: bash
      run: |
        set -euo pipefail
        bash releng/swt-receiver/test-retry-transient-maven-503.sh
        sudo apt-get update -qq
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev
        GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
          bash releng/swt-receiver/retry-transient-maven-503.sh \
          mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
          -Dtycho.baseline.replace=none -pl :org.eclipse.swt.gtk.linux.x86_64 -am package
        python3 releng/swt-receiver/prepare_swt_receiver.py .m3-swt \
          releng/swt-receiver/swt-receiver-p2/target/binding \
          releng/swt-receiver/swt-receiver-p2/target/repository
        mvn -B -f releng/swt-receiver/swt-receiver-p2/pom.xml \
          -Dm3.swt.source="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
        cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"

    - name: Trace exact-source Nebula compile with test sources for CodeQL
      shell: bash
      run: |
        set -euo pipefail
        mvn -V -B --fail-at-end clean package -DskipTests=true \
          -Dtycho.localArtifacts=ignore \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing SWT GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing SWT platform}"
        # CodeQL analysis follows only after a successful complete compilation.

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
