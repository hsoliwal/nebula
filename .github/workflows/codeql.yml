# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  schedule:
    - cron: '16 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    env:
      SWT_GTK4: '0'
      GDK_BACKEND: x11
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # required for all workflows
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin']
        # CodeQL supports [ 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift' ]
        # Use only 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use only 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install SHA-512-pinned Maven 3.9.11 for Tycho
      shell: bash
      run: |
        set -euo pipefail
        version=3.9.11
        expected_sha512=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        name="apache-maven-${version}-bin.tar.gz"
        archive="$RUNNER_TEMP/$name"
        urls=(
          "https://archive.apache.org/dist/maven/maven-3/${version}/binaries/$name"
          "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}/$name"
        )
        for url in "${urls[@]}"; do
          rm -f "$archive"
          if curl --fail --location --silent --show-error --retry 4 \
              --retry-all-errors --retry-delay 5 --connect-timeout 20 \
              --max-time 240 --output "$archive" "$url"; then
            if printf '%s  %s\n' "$expected_sha512" "$archive" | sha512sum --check --status; then
              echo "Pinned Maven distribution checksum verified"
              break
            fi
          fi
        done
        test -s "$archive"
        printf '%s  %s\n' "$expected_sha512" "$archive" | sha512sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/apache-maven-${version}/bin/mvn" -version |
          grep -m1 '^Apache Maven 3[.]9[.]11 '

    # CodeQL must trace the same source-pinned SWT JNI receiver that compiles
    # Nebula's inherited Canvas layer API. Upstream SWT lacks these methods.
    - name: Checkout source-pinned SWT GTK3 receiver
      uses: actions/checkout@v4
      with:
        repository: hsoliwal/eclipse.platform.swt
        ref: c449e70083a14030c341c6b2cab6048b20c83e79
        path: .m3-swt
        fetch-depth: 0
        lfs: false
    # Pin the original upstream 4.42 parent from immutable source, not a
    # mutable remote 4.42.0-SNAPSHOT POM that may return HTTP 503.
    - name: Checkout source-pinned Eclipse Platform parent
      uses: actions/checkout@v4
      with:
        repository: eclipse-platform/eclipse.platform.releng.aggregator
        ref: 8c8c8d8ccaa2dab6954ae083fdd14c31d258ccec
        path: .m3-eclipse-releng
        fetch-depth: 1
        lfs: false
        persist-credentials: false
        sparse-checkout: |
          eclipse-platform-parent
    - name: Verify Eclipse parent source before building pinned SWT
      shell: bash
      run: |
        set -euo pipefail
        python3 -m unittest discover -s releng/swt-receiver -p 'test_prepare_eclipse_platform_parent.py'
        python3 releng/swt-receiver/prepare_eclipse_platform_parent.py .m3-eclipse-releng .m3-swt

    - name: Validate receiver 503 refusal and build exact SWT GTK3 natives
      shell: bash
      run: |
        set -euo pipefail
        bash releng/swt-receiver/test-retry-transient-maven-503.sh
        sudo apt-get update -qq
        sudo apt-get install -qq -y libgtk-3-dev freeglut3-dev
        # Build every source-pinned SWT platform fragment expected by the P2
        # receiver. Only GTK x86_64 compiles native .so files on this host;
        # Cocoa/Win32/other architectures are Java/OSGi resolution inputs only.
        swt_fragments=':org.eclipse.swt.cocoa.macosx.aarch64,:org.eclipse.swt.cocoa.macosx.x86_64,:org.eclipse.swt.gtk.linux.aarch64,:org.eclipse.swt.gtk.linux.ppc64le,:org.eclipse.swt.gtk.linux.riscv64,:org.eclipse.swt.gtk.linux.x86_64,:org.eclipse.swt.win32.win32.aarch64,:org.eclipse.swt.win32.win32.x86_64'
        GTK_VERSION=3.0 GTK_XCFLAGS=-Wno-deprecated-declarations \
          bash releng/swt-receiver/retry-transient-maven-503.sh \
          mvn -B -U -f .m3-swt/pom.xml -Dnative=gtk.linux.x86_64 \
          -Dtycho.baseline.replace=none -DskipTests=true \
          -Dtycho-snapshot-repo.url=https://repo.maven.apache.org/maven2/ \
          -Declipse-snapshots-repo.url=https://repo.maven.apache.org/maven2/ \
          -Declipse-cbi-repo.url=https://repo.maven.apache.org/maven2/ \
          -pl "$swt_fragments" -am package
        python3 releng/swt-receiver/prepare_swt_receiver.py .m3-swt \
          releng/swt-receiver/swt-receiver-p2/target/binding \
          releng/swt-receiver/swt-receiver-p2/target/repository
        mvn -B -f releng/swt-receiver/swt-receiver-p2/pom.xml \
          -Dm3.swt.source="$PWD/releng/swt-receiver/swt-receiver-p2/target/binding/input" verify
        cat releng/swt-receiver/swt-receiver-p2/target/binding/receiver.env >> "$GITHUB_ENV"

    - name: Trace exact-source Nebula compile with test sources for CodeQL
      shell: bash
      run: |
        set -euo pipefail
        mvn -V -B --fail-at-end clean package -DskipTests=true \
          -Dtycho.localArtifacts=ignore \
          "-Dnebula.swt.gc.sha256=${M3_SWT_GC_SHA256:?missing SWT GC digest}" \
          "-Dtarget-platform-platform=${M3_SWT_PLATFORM:?missing SWT platform}"
        # CodeQL analysis follows only after a successful complete compilation.

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
