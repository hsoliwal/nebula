# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/workflows/m3-*.yml'
  schedule:
    - cron: '16 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Fork guard: run only in hsoliwal/nebula and only for same-repository PR heads.
    if: >-
      github.repository == 'hsoliwal/nebula' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # required for all workflows
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin']
        # CodeQL supports [ 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift' ]
        # Use only 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use only 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install SHA-512-pinned Maven 3.9.11 for Tycho
      shell: bash
      run: |
        set -euo pipefail
        version=3.9.11
        expected_sha512=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        name="apache-maven-${version}-bin.tar.gz"
        archive="$RUNNER_TEMP/$name"
        urls=(
          "https://archive.apache.org/dist/maven/maven-3/${version}/binaries/$name"
          "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}/$name"
        )
        for url in "${urls[@]}"; do
          rm -f "$archive"
          if curl --fail --location --silent --show-error --retry 4 \
              --retry-all-errors --retry-delay 5 --connect-timeout 20 \
              --max-time 240 --output "$archive" "$url"; then
            if printf '%s  %s\n' "$expected_sha512" "$archive" | sha512sum --check --status; then
              echo "Pinned Maven distribution checksum verified"
              break
            fi
          fi
        done
        test -s "$archive"
        printf '%s  %s\n' "$expected_sha512" "$archive" | sha512sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/apache-maven-${version}/bin/mvn" -version |
          grep -m1 '^Apache Maven 3[.]9[.]11 '
    # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, or Swift).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    # - run: |
    #     echo "Run, Build Application using script"
    #     ./location_of_script_within_repo/buildscript.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
