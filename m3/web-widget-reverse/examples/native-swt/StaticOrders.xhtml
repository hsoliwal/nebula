<html xmlns="http://www.w3.org/1999/xhtml">
  <body>
    <section id="ordersPanel">
      <h2>Orders &amp; inventory</h2>
      <p>Fast &amp; safe native controls</p>
      <input type="text" id="query" value="A&amp;B" readonly="readonly" />
      <input type="checkbox" id="active" checked="checked" />
      <input type="password" id="secret" />
      <select id="region"><option>North &amp; West</option><option selected="selected">South</option></select>
      <textarea id="notes" readonly="readonly">line1&#10;line2</textarea>
      <table id="data">
        <thead><tr><th>Order</th><th>Status</th></tr></thead>
        <tbody><tr><td>A-01</td><td>Ready &amp; queued</td></tr></tbody>
      </table>
      <button type="button" disabled="disabled">Save &amp; Close</button>
    </section>
  </body>
</html>
