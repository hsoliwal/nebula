<html xmlns="http://www.w3.org/1999/xhtml">
  <body>
    <section id="ranges">
      <h2>Live controls excluded; static values only</h2>
      <input id="brightness" type="range" min="0" max="100" value="35" step="1"/>
      <input id="zoom" type="range" min="150" max="800" value="430" disabled="disabled"/>
    </section>
  </body>
</html>
