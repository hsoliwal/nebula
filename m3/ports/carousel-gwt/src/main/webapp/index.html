<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebula Carousel browser profile</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem; color: #24303a; }
    .nebula-carousel { display: block; outline-offset: 3px; }
    #carousel-controls { margin-top: 1rem; }
    button { margin-right: .5rem; padding: .5rem 1rem; }
  </style>
  <script src="carousel/carousel.nocache.js"></script>
</head>
<body>
  <h1>Nebula Carousel</h1>
  <div id="carousel-example"></div>
  <div id="carousel-controls" aria-label="Carousel navigation"></div>
  <div id="carousel-status" aria-live="polite"></div>
  <p>Two local images use the original carousel fit and slide rules.</p>
  <noscript>This example requires JavaScript and Canvas2D.</noscript>
</body>
</html>
